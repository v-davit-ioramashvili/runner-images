# TEMPORARY - validation aid for #14474.
# Reproduces the Sequoia "bash is requesting to bypass the system private window
# picker" alert on hosted macOS runners while ffmpeg/avfoundation records the
# screen, then re-runs the capture with a pre-seeded replayd approval to check
# whether the alert is suppressed.
#
# Iteration 1 finding: replayd keys its approvals by the *responsible* process,
# which on a hosted runner is /opt/hca/hosted-compute-agent - not /bin/bash,
# even though the alert itself says "bash". Seeding /bin/bash changed nothing.
# The real entry is a dict:
#   "/opt/hca/hosted-compute-agent" => {
#     kScreenCaptureAlertableUsageCount => 2
#     kScreenCaptureApprovalLastAlerted => <now>
#     kScreenCaptureApprovalLastUsed    => <now>
#     kScreenCapturePrivacyHintDate     => <now + 30d>
#     kScreenCapturePrivacyHintPolicy   => 2592000
#   }
# This run tests seeding that key, as a bare date (replayd expanded a bare date
# into the full dict on its own last time) and as the full dict.
# Delete this file before opening the PR.

name: Validate macOS screen-recording popup

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/macos-screenrec*'

jobs:
  screenrec:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15-intel, macos-15, macos-26]
        mode: [baseline, hca-bare, hca-dict]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45

    env:
      APPROVALS_PLIST: ${{ github.workspace }}/approvals-path.txt
      FUTURE_DATE: '3024-01-01 00:00:00 +0000'
      RESPONSIBLE_CLIENT: /opt/hca/hosted-compute-agent

    steps:
      - name: Image and shell facts
        run: |
          sw_vers
          echo "whoami: $(whoami)"
          echo "HOME: $HOME"
          echo "responsible binary: $(ps -p $$ -o args=)"

      - name: replayd approval state as shipped
        run: |
          plist="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          echo "$plist" > "$APPROVALS_PLIST"
          if [ -f "$plist" ]; then
            plutil -p "$plist"
          else
            echo "ScreenCaptureApprovals.plist does not exist in the image"
          fi

      - name: Seed approval as a bare date
        if: matrix.mode == 'hca-bare'
        run: |
          plist="$(cat "$APPROVALS_PLIST")"
          mkdir -p "$(dirname "$plist")"
          defaults write "$plist" "$RESPONSIBLE_CLIENT" -date "$FUTURE_DATE"
          plutil -p "$plist"
          sudo killall replayd 2>/dev/null || echo "replayd was not running"
          sleep 5

      - name: Seed approval as the full dict replayd writes itself
        if: matrix.mode == 'hca-dict'
        run: |
          plist="$(cat "$APPROVALS_PLIST")"
          mkdir -p "$(dirname "$plist")"
          [ -f "$plist" ] || /usr/libexec/PlistBuddy -c "Save" "$plist"

          pb() { /usr/libexec/PlistBuddy -c "$1" "$plist"; }
          entry=":$RESPONSIBLE_CLIENT"
          pb "Delete $entry" 2>/dev/null || true
          pb "Add $entry dict"
          pb "Add $entry:kScreenCaptureAlertableUsageCount integer 1"
          pb "Add $entry:kScreenCaptureApprovalLastAlerted date 3024-01-01T00:00:00Z"
          pb "Add $entry:kScreenCaptureApprovalLastUsed date 3024-01-01T00:00:00Z"
          pb "Add $entry:kScreenCapturePrivacyHintDate date 3024-01-01T00:00:00Z"
          pb "Add $entry:kScreenCapturePrivacyHintPolicy integer 2592000"

          plutil -p "$plist"
          sudo killall replayd 2>/dev/null || echo "replayd was not running"
          sleep 5

      - name: replayd approval state after seeding and restart
        if: matrix.mode != 'baseline'
        run: plutil -p "$(cat "$APPROVALS_PLIST")"

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Record the screen and look for the alert
        run: |
          # UserNotificationCenter hosts the alert and is launched on demand,
          # so its presence before/after the capture is the reliable signal;
          # osascript window enumeration needs Accessibility, which is not
          # granted to osascript on macOS 26.
          if pgrep -x UserNotificationCenter >/dev/null; then
            echo "UNC_BEFORE=running"
          else
            echo "UNC_BEFORE=absent"
          fi

          ffmpeg -y -nostdin -f avfoundation \
            -video_size 1920x1080 \
            -r 30 \
            -i "0:none" \
            -codec:v mpeg4 \
            -b:v 10000k \
            -t 15 \
            screen_recording.mp4 > ffmpeg.log 2>&1 &
          ffmpeg_pid=$!

          sleep 6

          if pgrep -x UserNotificationCenter >/dev/null; then
            echo "ALERT_PRESENT=true"
          else
            echo "ALERT_PRESENT=false"
          fi

          osascript -e 'tell application "System Events" to get every window of (every process whose class of windows contains window)' 2>&1 || true
          screencapture -x mid-recording.png || echo "screencapture failed"

          wait $ffmpeg_pid; rc=$?
          echo "ffmpeg exit code: $rc"
          tail -5 ffmpeg.log
          ls -la screen_recording.mp4 || true
          exit $rc

      - name: replayd approval state after the capture
        if: always()
        run: |
          plist="$(cat "$APPROVALS_PLIST")"
          if [ -f "$plist" ]; then
            plutil -p "$plist"
          else
            echo "ScreenCaptureApprovals.plist still does not exist"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenrec-${{ matrix.image }}-${{ matrix.mode }}
          path: |
            mid-recording.png
            ffmpeg.log
          if-no-files-found: warn
