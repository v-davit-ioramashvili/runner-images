# TEMPORARY - validation aid for #14474. Delete before opening the PR.
#
# Iteration 1: reproduced the alert; seeding /bin/bash changed nothing.
# Iteration 2: replayd keys approvals by the *responsible* process, which on a
#   hosted runner is /opt/hca/hosted-compute-agent, not /bin/bash.
# Iteration 3: ran the committed build script itself - alert suppressed.
# Iteration 4 (this one): re-runs iteration 3 against the current script, now
#   that the read-back assertion has been replaced by a test, and checks that
#   the new System.Tests.ps1 assertion guards something - it must pass on a
#   seeded runner and FAIL on an unseeded one.
#
# The TCC seeding in the build script needs ~/utils/utils.sh and writes to the
# system TCC.db, neither of which belongs in a job, so those two helpers are
# stubbed; everything after them is the real thing.
#
# Stricter than a real build: replayd is already running with no approvals file
# when the script writes it, and is never restarted. What no workflow can cover
# is VM sealing.

name: Validate macOS screen-recording popup

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/macos-screenrec*'

jobs:
  screenrec:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15-intel, macos-15, macos-26]
        mode: [baseline, build-script]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 45

    env:
      APPROVALS_PLIST: ${{ github.workspace }}/approvals-path.txt

    steps:
      - uses: actions/checkout@v5

      - name: Image facts and approval state as shipped
        run: |
          sw_vers
          plist="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          echo "$plist" > "$APPROVALS_PLIST"
          if [ -f "$plist" ]; then
            plutil -p "$plist"
          else
            echo "ScreenCaptureApprovals.plist does not exist in the image"
          fi

      - name: Run the real build script from this branch
        if: matrix.mode == 'build-script'
        run: |
          mkdir -p ~/utils
          cat > ~/utils/utils.sh <<'EOF'
          configure_system_tccdb () { :; }
          configure_user_tccdb () { :; }
          EOF

          bash -e -o pipefail images/macos/scripts/build/configure-tccdb-macos.sh
          echo "script exit code: $?"
          plutil -p "$(cat "$APPROVALS_PLIST")"

      - name: Check the image test guards the approval
        run: |
          cat > run-test.ps1 <<'EOF'
          $config = [PesterConfiguration]@{
              Run    = @{ Path = "images/macos/scripts/tests/System.Tests.ps1"; PassThru = $true }
              Filter = @{ FullName = "Screen capture approval*" }
              Output = @{ Verbosity = "Detailed" }
          }
          $r = Invoke-Pester -Configuration $config
          "PESTER_RESULT passed=$($r.PassedCount) failed=$($r.FailedCount)"
          EOF

          pwsh -File run-test.ps1 | tee pester.log

          if [ "${{ matrix.mode }}" = "build-script" ]; then
            grep -q "PESTER_RESULT passed=1 failed=0" pester.log \
              || { echo "FAIL: test did not pass although the approval is seeded"; exit 1; }
            echo "OK - test passes when the approval is seeded"
          else
            grep -q "PESTER_RESULT passed=0 failed=1" pester.log \
              || { echo "FAIL: test did not fail on an unseeded image - it guards nothing"; exit 1; }
            echo "OK - test fails when the approval is missing"
          fi

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Record the screen and look for the alert
        run: |
          ffmpeg -y -nostdin -f avfoundation \
            -video_size 1920x1080 \
            -r 30 \
            -i "0:none" \
            -codec:v mpeg4 \
            -b:v 10000k \
            -t 15 \
            screen_recording.mp4 > ffmpeg.log 2>&1 &
          ffmpeg_pid=$!

          sleep 6

          if pgrep -x UserNotificationCenter >/dev/null; then
            echo "ALERT_PRESENT=true"
          else
            echo "ALERT_PRESENT=false"
          fi

          screencapture -x mid-recording.png || echo "screencapture failed"

          wait $ffmpeg_pid; rc=$?
          echo "ffmpeg exit code: $rc"
          exit $rc

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenrec-${{ matrix.image }}-${{ matrix.mode }}
          path: |
            mid-recording.png
            ffmpeg.log
            pester.log
          if-no-files-found: warn
