name: Brew Double Update 14794

on:
  workflow_dispatch:

jobs:
  workaround:
    name: Workaround ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    steps:
      - name: Disable git auto-maintenance, then double update (fresh runner)
        run: |
          git config --global maintenance.auto false
          git config --global gc.auto 0
          set +e
          brew update && brew update
          echo "WORKAROUND_CHAINED_EXIT=$?"
          echo "=== lsof on lock after ==="
          /usr/sbin/lsof "$(brew --prefix)/var/homebrew/locks/update" 2>&1
