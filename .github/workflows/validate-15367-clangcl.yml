name: Validate 15367 VS LLVM contents
on:
  push:
    branches: [validate/15367-clangcl-impact]
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Compare
        shell: pwsh
        run: |
          Write-Host "ImageVersion=$env:ImageVersion"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') {'ARM64'} else {'x64'}
          $vsBin = Join-Path $vs "VC\Tools\Llvm\$arch\bin"
          $saBin = 'C:\Program Files\LLVM\bin'
          Write-Host "VS clang: $(& "$vsBin\clang.exe" --version | Select-Object -First 1)"
          Write-Host "SA clang: $(& "$saBin\clang.exe" --version | Select-Object -First 1)"
          $vsF = (Get-ChildItem $vsBin -File).Name | Sort-Object
          $saF = (Get-ChildItem $saBin -File).Name | Sort-Object
          Write-Host "VS count=$($vsF.Count) SA count=$($saF.Count)"
          Write-Host "ONLY_IN_STANDALONE: $((Compare-Object $vsF $saF | Where-Object SideIndicator -eq '=>').InputObject -join ', ')"
          Write-Host "ONLY_IN_VS: $((Compare-Object $vsF $saF | Where-Object SideIndicator -eq '<=').InputObject -join ', ')"
          foreach ($t in 'clang-cl.exe','clang++.exe','lld-link.exe','libclang.dll','clang-tidy.exe','clang-format.exe','clangd.exe','llvm-ar.exe','llvm-profdata.exe','llvm-cov.exe','llvm-symbolizer.exe','lldb.exe') { Write-Host ("HAS {0,-20} VS={1} SA={2}" -f $t, (Test-Path "$vsBin\$t"), (Test-Path "$saBin\$t")) }
          Write-Host "VS lib\clang: $((Get-ChildItem (Join-Path $vs "VC\Tools\Llvm\$arch\lib\clang") -Directory -ErrorAction SilentlyContinue).Name)"
          Write-Host "PATH has VS llvm: $($env:PATH -like "*VC\Tools\Llvm*")"
