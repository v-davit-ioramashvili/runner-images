name: Validate 15367 workaround
on:
  push:
    branches: [validate/15367-clangcl-impact]
jobs:
  workaround:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    runs-on: windows-2025-vs2026
    steps:
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Use Clang bundled with Visual Studio
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:VCINSTALLDIR\Tools\Llvm\x64\bin"
      - name: Build
        shell: pwsh
        run: |
          Write-Host "ImageVersion=$env:ImageVersion MSVC=$env:VCToolsVersion"
          Write-Host "clang-cl: $((Get-Command clang-cl).Source)"
          clang-cl --version | Select-Object -First 1
          "#include <atomic>`nint main(){std::atomic<int> a{0};return a.load();}" | Set-Content a.cpp
          "cmake_minimum_required(VERSION 3.20)`nproject(p CXX)`nadd_executable(a a.cpp)" | Set-Content CMakeLists.txt
          clang-cl /nologo a.cpp /Fe:a1.exe; Write-Host "clang-cl direct: $LASTEXITCODE"
          clang++ a.cpp -o a2.exe; Write-Host "clang++ direct: $LASTEXITCODE"
          cmake -S . -B b -G Ninja -DCMAKE_CXX_COMPILER=clang-cl | Out-Null; cmake --build b | Out-Null; Write-Host "cmake ninja clang-cl: $LASTEXITCODE"
