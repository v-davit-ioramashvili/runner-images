# TEMPORARY - validation aid for #14810 (Edge stuck at 152 on windows-2022).
name: Validate Edge updates 14810

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/edge-win2022-14810'

jobs:
  edge-msi:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Install latest Edge Stable MSI and verify
        shell: pwsh
        run: |
          $edgeExe = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          Write-Host "ImageVersion = $env:ImageVersion"
          Write-Host "Before = $([System.Diagnostics.FileVersionInfo]::GetVersionInfo($edgeExe).ProductVersion)"
          $products = Invoke-RestMethod "https://edgeupdates.microsoft.com/api/products"
          $release = ($products | Where-Object Product -eq 'Stable').Releases |
            Where-Object { $_.Platform -eq 'Windows' -and $_.Architecture -eq 'x64' } |
            Sort-Object { [version]$_.ProductVersion } -Descending | Select-Object -First 1
          $msi = $release.Artifacts | Where-Object ArtifactName -eq 'msi'
          Write-Host "Latest Stable = $($release.ProductVersion) ($($msi.Location))"
          $path = "$env:TEMP\MicrosoftEdgeEnterpriseX64.msi"
          Invoke-WebRequest $msi.Location -OutFile $path
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash
          Write-Host "SHA256 match = $($hash -eq $msi.Hash)"
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$path`" /qn /norestart" -Wait -PassThru
          Write-Host "msiexec exit = $($p.ExitCode)"
          $after = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($edgeExe).ProductVersion
          Write-Host "After = $after"
          if ([version]$after -ne [version]$release.ProductVersion) { throw "Edge not updated" }
          & $edgeExe --version
