# TEMPORARY - validation aid for #14780.
# Runs the same install loop as install-apt-common.sh against the branch's
# 26.04 toolsets, then checks libcrypt-dev is installed, crypt.h compiles and
# links, and the software report query returns a version.
# Delete this file before opening the PR.

name: Validate libcrypt-dev (#14780)

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/libcrypt-dev-14780*'

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            toolset: toolset-2604.json
          - os: ubuntu-26.04-arm
            toolset: toolset-2604-arm64.json
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Image info
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          dpkg-query -W -f='${Package} ${Version}\n' libcrypt-dev 2>&1 || true

      - name: Install common_packages from branch toolset (same loop as install-apt-common.sh)
        run: |
          toolset=images/ubuntu/toolsets/${{ matrix.toolset }}
          jq -e '.apt.common_packages | index("libcrypt-dev")' "$toolset"
          sudo apt-get update -qq
          for package in $(jq -r '.apt.common_packages[]' "$toolset"); do
            echo "Install $package"
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $package >/dev/null
          done

      - name: Verify
        run: |
          echo "Software report version: $(dpkg-query -W -f '${Version}' libcrypt-dev)"
          ls -l /usr/include/crypt.h
          cat > t.c <<'SRC'
          #include <crypt.h>
          #include <stdio.h>
          int main(void) { puts(crypt("pw", "$6$salt$")); return 0; }
          SRC
          gcc t.c -o t -lcrypt && ./t
