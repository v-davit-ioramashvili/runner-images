name: Verify 14093 - pinned vs range

on:
  workflow_dispatch:
  push:
    branches:
      - verify/14093-pinned

jobs:
  pinned:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: What is cached
        run: ls -1 /opt/hostedtoolcache/node 2>/dev/null || echo "no node in toolcache"

      - name: setup-node range 22 (expect cache hit)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: setup-node pinned 22.13.1 (expect download)
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
