name: Repro 15107 pwsh startup probe

# Shows which launch paths make pwsh run TaskbarJumpList (actions/runner-images#15107) and how many gen0 GCs
# run during pwsh startup with and without DOTNET_GCgen0size.
on:
  push:
    branches: [repro/15107-pwsh-jumplist-crash]
    paths: ['.github/repro-15107/probe.ps1', '.github/workflows/repro-pwsh-probe-15107.yml']

jobs:
  probe:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Probe a shell pwsh step
        shell: pwsh
        run: ./.github/repro-15107/probe.ps1 -Label 'shell=pwsh step'
      - name: Probe pwsh spawned from Node (as @actions/exec does)
        shell: cmd
        run: |
          node -e "require('child_process').spawnSync('C:\\Program Files\\PowerShell\\7\\pwsh.exe',['-NoProfile','-File','.github/repro-15107/probe.ps1','-Label','node spawn, default'],{stdio:'inherit'})"
          set DOTNET_GCgen0size=4000000
          node -e "require('child_process').spawnSync('C:\\Program Files\\PowerShell\\7\\pwsh.exe',['-NoProfile','-File','.github/repro-15107/probe.ps1','-Label','node spawn, GCgen0size'],{stdio:'inherit'})"
          set DOTNET_GCgen0size=
          set DOTNET_GCgen0MaxBudget=40000
          node -e "require('child_process').spawnSync('C:\\Program Files\\PowerShell\\7\\pwsh.exe',['-NoProfile','-File','.github/repro-15107/probe.ps1','-Label','node spawn, GCgen0MaxBudget=40000'],{stdio:'inherit'})"
          node -e "require('child_process').spawnSync('C:\\Program Files\\PowerShell\\7\\pwsh.exe',['-NoProfile','-File','.github/repro-15107/probe.ps1','-Label','node spawn, windowsHide'],{stdio:'inherit',windowsHide:true})"
