name: apt mirror probe
on:
  push:
    branches: [probe/15142-apt-speed]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, ubuntu-24.04]
        rep: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: apt config and low-speed options
        run: |
          apt --version
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
          cat /etc/apt/apt-mirrors.txt
          echo '--- low-speed / min-rate knobs known to apt?'
          grep -inE 'low.?speed|min.?rate|speed' /usr/share/doc/apt/examples/configure-index* 2>/dev/null || echo 'none in configure-index'
          for f in /usr/lib/apt/methods/http /usr/lib/*/libapt-pkg.so.*; do strings "$f" | grep -iE 'low.?speed|Dl-Limit|min.?speed' | sed "s|^|$f: |"; done || true
      - name: DNS of azure.archive.ubuntu.com
        run: |
          for i in 1 2 3; do dig +noall +answer azure.archive.ubuntu.com; echo; sleep 2; done
      - name: Time a .deb from each regional mirror LB
        run: |
          sudo apt-get update -qq
          pkg=libwebkitgtk-6.0-4
          [ "$(lsb_release -cs)" = noble ] && pkg=libwebkit2gtk-4.1-0
          path=$(apt-cache show $pkg | awk '/^Filename:/{print $2; exit}')
          echo "file: $path"
          probe() { # label ip-or-empty
            local args=(); [ -n "$2" ] && args=(--resolve "azure.archive.ubuntu.com:80:$2")
            curl -s -o /dev/null -D /tmp/h --max-time 40 "${args[@]}" \
              -w "$1 ip=%{remote_ip} code=%{http_code} size=%{size_download} time=%{time_total}s speed=%{speed_download}B/s\n" \
              "http://azure.archive.ubuntu.com/ubuntu/$path" || echo "$1 curl exit $?"
            grep -iE '^(via|x-cache):' /tmp/h | tr -d '\r' | sed 's/^/    /'
          }
          for i in 1 2 3; do probe "default#$i" ""; done
          for r in westus3 westus westus2 southcentralus centralus northcentralus westcentralus eastus eastus2; do
            ip=$(dig +short cloud-mirror-lb.$r.cloudapp.azure.com A | tail -1)
            [ -z "$ip" ] && { echo "$r: no LB"; continue; }
            probe "$r" "$ip"
          done
          curl -s -o /dev/null --max-time 40 -w "archive.ubuntu.com speed=%{speed_download}B/s\n" "https://archive.ubuntu.com/ubuntu/$path" || true
