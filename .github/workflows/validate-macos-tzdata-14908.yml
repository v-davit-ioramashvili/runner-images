name: validate-macos-tzdata-14908

on: workflow_dispatch

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Before
        run: |
          echo "ImageVersion=$ImageVersion arch=$(uname -m) $(sw_vers -productVersion) $(sw_vers -buildVersion)"
          echo "tzdata: $(cat /usr/share/zoneinfo/+VERSION)"
          ls -la /var/db/timezone
          echo "--- AssetsV2 entries"; sudo ls /System/Library/AssetsV2 2>&1
          echo "--- tzd launchd job"
          ls -la /System/Library/LaunchDaemons/ 2>&1 | grep -i -E 'tzd|timezone|mobileasset'
          sudo launchctl print system/com.apple.tzd 2>&1 | grep -E 'state|path|program|last exit' | head
          sudo launchctl print-disabled system 2>&1 | grep -i -E 'tzd|mobileasset' || echo "tzd/mobileassetd not in disabled list"
          echo "--- TimeZoneUpdate catalog xml (if any)"
          sudo find /System/Library/AssetsV2 -maxdepth 2 -iname '*TimeZone*' -print 2>&1
          echo "--- reachability of Apple asset server"
          curl -sS -o /dev/null -w 'mesu.apple.com %{http_code} %{time_total}s\n' https://mesu.apple.com/assets/ 2>&1

      - name: Kick tzd and wait for asset download
        timeout-minutes: 12
        run: |
          sudo launchctl kickstart -k system/com.apple.tzd 2>&1
          for i in $(seq 1 20); do
            v=$(cat /usr/share/zoneinfo/+VERSION)
            echo "$(date -u +%T) tzdata=$v tz_dir=$(ls /var/db/timezone/tz 2>/dev/null | tr '\n' ' ')"
            [ -d /var/db/timezone/tz ] && break
            sleep 30
          done

      - name: After + logs
        run: |
          echo "tzdata: $(cat /usr/share/zoneinfo/+VERSION)"
          ls -la /var/db/timezone /var/db/timezone/tz 2>&1
          sudo log show --last 30m --style compact \
            --predicate 'process == "tzd" OR eventMessage CONTAINS[c] "TimeZoneUpdate"' 2>&1 | tail -50
