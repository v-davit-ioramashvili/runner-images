name: validate-macos-tzdata-14908

on: workflow_dispatch

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        mode: [kick, nokick]
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash {0}
    steps:
      - name: Wait for tzdata asset (${{ matrix.mode }})
        timeout-minutes: 15
        run: |
          echo "ImageVersion=$ImageVersion boot=$(sysctl -n kern.boottime)"
          echo "start tzdata=$(cat /usr/share/zoneinfo/+VERSION)"
          if [ "${{ matrix.mode }}" = kick ]; then
            sudo launchctl print system/com.apple.timezoneupdates.tzd 2>&1 | grep -E '^\s*(state|program|path) ' | head -5
            sudo launchctl kickstart -k system/com.apple.timezoneupdates.tzd; echo "kickstart rc=$?"
          fi
          start=$(date +%s)
          while :; do
            el=$(( $(date +%s) - start ))
            tgt=$(readlink /var/db/timezone/zoneinfo)
            v=$(cat /usr/share/zoneinfo/+VERSION)
            echo "+${el}s tzdata=$v zoneinfo->$tgt"
            case "$tgt" in /var/db/timezone/tz/*) echo "SWITCHED after ${el}s"; break ;; esac
            [ $el -ge 840 ] && { echo "NOT switched after ${el}s"; break; }
            sleep 10
          done
          ls -la /var/db/timezone
