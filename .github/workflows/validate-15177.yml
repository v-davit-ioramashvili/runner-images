name: validate-15177
on: workflow_dispatch
jobs:
  fix-override:
    runs-on: ubuntu-26.04
    steps:
      - name: Install the tmp.conf override and run the boot-time rules for /tmp
        run: |
          echo "D /tmp 1777 root root -" | sudo tee /etc/tmpfiles.d/tmp.conf
          sudo systemd-tmpfiles --create --remove --boot --prefix=/tmp
          echo "remaining old entries:"; sudo find /tmp -mindepth 1 -maxdepth 1 ! -newermt '2026-10-28' -printf '%M %u:%g %TY-%Tm-%Td %TH:%TM %p\n'
          echo "x11.conf etc:"; systemd-tmpfiles --cat-config | grep -E '^[^#].*[[:space:]]/tmp/' || true
