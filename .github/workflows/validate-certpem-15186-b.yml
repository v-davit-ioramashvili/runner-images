name: validate-certpem-15186-b
on:
  push:
    branches: [validate/15186-certpem]
  workflow_dispatch:

jobs:
  trust:
    name: trust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26-intel]
    steps:
      - name: Prepare probes
        run: |
          cat > "$RUNNER_TEMP/urlsession.swift" <<'EOF'
          import Foundation
          let url = URL(string: CommandLine.arguments[1])!
          let sem = DispatchSemaphore(value: 0)
          var code: Int32 = 1
          URLSession.shared.dataTask(with: url) { _, _, err in
            if let err = err { FileHandle.standardError.write("\(err.localizedDescription)\n".data(using: .utf8)!) } else { code = 0 }
            sem.signal()
          }.resume()
          sem.wait()
          exit(code)
          EOF
          swiftc -O -o "$RUNNER_TEMP/urlsession" "$RUNNER_TEMP/urlsession.swift"
          cat > "$RUNNER_TEMP/probe.sh" <<'EOF'
          probe() {
            local name=$1 tag=$2; shift 2; local out r
            if out=$("$@" 2>&1 </dev/null); then r=ACCEPT; else r=REJECT; fi
            printf '%-12s | %-18s | %-4s | %s\n' "$PHASE" "$name" "$tag" "$r" | tee -a "$RUNNER_TEMP/results.txt"
            [ "$r" = REJECT ] && printf '    %s\n' "$(echo "$out" | grep -v '^\s*$' | tail -1 | cut -c1-160)"; return 0
          }
          run_all() {
            for pair in EMS:https://dv-g3b-emudhra.we-have-a-problem.com/ AAA:https://dv-g3b-aaa-emudhra.we-have-a-problem.com/ CTL:https://github.com/; do
              tag=${pair%%:*}; url=${pair#*:}
              probe /usr/bin/curl $tag /usr/bin/curl -sS -o /dev/null --max-time 30 "$url"
              probe /usr/bin/python3 $tag /usr/bin/python3 -c 'import sys,urllib.request; urllib.request.urlopen(sys.argv[1], timeout=30)' "$url"
              probe URLSession $tag "$RUNNER_TEMP/urlsession" "$url"
            done
          }
          EOF

      - name: Trust store and update settings
        run: |
          set +e
          sw_vers
          echo "--- SoftwareUpdate prefs (system domain, then runner user domain)"
          defaults read /Library/Preferences/com.apple.SoftwareUpdate
          defaults read com.apple.SoftwareUpdate
          echo "--- trustd Valid DB"
          sudo ls -l /private/var/protected/trustd/ /Library/Keychains/crls/ 2>&1
          for db in /private/var/protected/trustd/valid.sqlite3 /Library/Keychains/crls/valid.sqlite3; do
            sudo test -f "$db" && echo "$db" && sudo sqlite3 "$db" "select * from admin;" 2>&1
          done
          echo "--- trust store asset"
          sudo ls -l /private/var/protected/trustd/SupplementalsAssets/ 2>&1
          sudo ls -l /System/Library/Security/Certificates.bundle/Contents/Resources/ 2>&1 | head
          plutil -p /System/Library/Security/Certificates.bundle/Contents/Info.plist 2>&1 | grep -i version
          echo "--- softwareupdate history (config data)"
          softwareupdate --history --all 2>&1 | head -20

      - name: Phase A - stock
        run: |
          set +e; source "$RUNNER_TEMP/probe.sh"; PHASE=A-stock; run_all

      - name: Phase B - Apple cert.pem steps
        run: |
          set +e
          sudo cp -p /etc/ssl/cert.pem /etc/ssl/cert.pem.orig
          for s in '=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
                   '=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services'; do
            t=$(mktemp) && awk -v s="$s" '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem > "$t" && [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
          done
          echo "certs now: $(grep -c 'BEGIN CERTIFICATE' /etc/ssl/cert.pem)"
          source "$RUNNER_TEMP/probe.sh"; PHASE=B-certpem; run_all

      - name: Phase C - cert.pem steps plus deny trust in System keychain
        run: |
          set +e
          for cn in "emSign ECC Root CA - G3" "AAA Certificate Services"; do
            f="$RUNNER_TEMP/$(echo "$cn" | tr ' ' '_').pem"
            security find-certificate -c "$cn" -p /System/Library/Keychains/SystemRootCertificates.keychain > "$f"
            sudo security add-trusted-cert -d -r deny -k /Library/Keychains/System.keychain "$f"; echo "add-trusted-cert deny '$cn' rc=$?"
          done
          sudo security dump-trust-settings -d 2>&1 | head -30
          source "$RUNNER_TEMP/probe.sh"; PHASE=C-deny; run_all

      - name: Summary
        if: always()
        run: |
          { echo '```'; cat "$RUNNER_TEMP/results.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/results.txt"
