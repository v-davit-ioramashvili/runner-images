name: Repro 15187 - GMAP ProteinAmide float mismatch

# Runs the reporter's unchanged code (lacourjansenlab/GMAP @ 0755716, same as their
# failing run) with pinned requirements, varying only the CPython patch version
# that setup-python resolves for "3.13", to isolate the regression.

on:
  push:
    branches: [validate/float-15187]

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.13.17']
        sample: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lacourjansenlab/GMAP
          ref: 0755716338756482a5d75e39462d0d033b1e5ca0
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          echo "ImageVersion=$ImageVersion"; uname -r
          python -VV
          lscpu | grep -E 'Model name|Flags' | cut -c1-200
      - name: Install (pinned)
        working-directory: source
        run: |
          python -m pip install -q -r requirements_py3-13.txt
          python -m pip install -q -e ".[testing]"
          python -m pip freeze | grep -iE '^(numpy|numba|llvmlite|scipy|mdanalysis)=='
      - name: BLAS / SIMD detection
        working-directory: source
        run: |
          python -c "import numpy; numpy.show_runtime()" 2>&1 | grep -E "architecture|internal_api|num_threads|version|found|not_found" | head -20
      - name: ProteinAmide tests - default
        if: always()
        working-directory: source
        run: pytest -p GMAP.tests.conftest GMAP/maps/Pairs/ProteinAmide/tests -q 2>&1 | tail -n 3
        shell: bash -o pipefail {0}
      - name: ProteinAmide tests - OPENBLAS_CORETYPE=Haswell
        if: always()
        working-directory: source
        env:
          OPENBLAS_CORETYPE: Haswell
        run: pytest -p GMAP.tests.conftest GMAP/maps/Pairs/ProteinAmide/tests -q 2>&1 | tail -n 3
        shell: bash -o pipefail {0}
      - name: ProteinAmide tests - OPENBLAS_NUM_THREADS=1
        if: always()
        working-directory: source
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: pytest -p GMAP.tests.conftest GMAP/maps/Pairs/ProteinAmide/tests -q 2>&1 | tail -n 3
        shell: bash -o pipefail {0}
