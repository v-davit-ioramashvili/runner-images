name: Repro 15187 - GMAP ProteinAmide float mismatch

# Runs the reporter's unchanged code (lacourjansenlab/GMAP @ 0755716, same as their
# failing run) with pinned requirements, varying only the CPython patch version
# that setup-python resolves for "3.13", to isolate the regression.

on:
  push:
    branches: [validate/float-15187]

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.13.17']
        sample: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lacourjansenlab/GMAP
          ref: 0755716338756482a5d75e39462d0d033b1e5ca0
          path: source
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          echo "ImageVersion=$ImageVersion"; uname -r
          python -VV
          lscpu | grep -E 'Model name|Flags' | cut -c1-200
      - name: Install (pinned)
        working-directory: source
        run: |
          python -m pip install -q -r requirements_py3-13.txt
          python -m pip install -q -e ".[testing]"
          python -m pip freeze | grep -iE '^(numpy|numba|llvmlite|scipy|mdanalysis)=='
      - name: Filesystem directory order
        working-directory: source
        run: |
          df -T . | tail -1
          sudo dumpe2fs -h "$(df --output=source . | tail -1)" 2>/dev/null | grep -iE 'hash seed|default directory hash' || true
          echo "--- raw iterdir order of GMAP/maps/Pairs and Singles:"
          python -c "from pathlib import Path; [print(d, [p.name for p in Path(d).iterdir()]) for d in ('GMAP/maps/Pairs','GMAP/maps/Singles')]"
      - name: ProteinAmide tests - unchanged (raw iterdir order)
        if: always()
        working-directory: source
        run: pytest -p GMAP.tests.conftest GMAP/maps/Pairs/ProteinAmide/tests -q 2>&1 | tail -n 3
        shell: bash -o pipefail {0}
      - name: ProteinAmide tests - map discovery sorted
        if: always()
        working-directory: source
        run: |
          git checkout -q -- GMAP/src/tools/map_reader.py
          sed -i -E 's/\[\*(direc|subdir)\.iterdir\(\)\]/sorted(.iterdir())/g' GMAP/src/tools/map_reader.py
          git diff --stat
          pytest -p GMAP.tests.conftest GMAP/maps/Pairs/ProteinAmide/tests -q 2>&1 | tail -n 3
        shell: bash -o pipefail {0}
      - name: ProteinAmide tests - map discovery reverse-sorted
        if: always()
        working-directory: source
        run: |
          git checkout -q -- GMAP/src/tools/map_reader.py
          sed -i -E 's/\[\*(direc|subdir)\.iterdir\(\)\]/sorted(.iterdir(), reverse=True)/g' GMAP/src/tools/map_reader.py
          git diff --stat
          pytest -p GMAP.tests.conftest GMAP/maps/Pairs/ProteinAmide/tests -q 2>&1 | tail -n 3
        shell: bash -o pipefail {0}
