# TEMPORARY - validation aid for #14061.
# End-to-end proof on the hosted windows-11-arm runner: drives Chromium's REAL
# build/vs_toolchain.py (_CopyDebugger) - the exact code that emits the reporter's
# "Debugging Tools for Windows" error. Shows it RAISES that error for x64 before the
# fix, then PASSES after copying the SDK's own x64 dbghelp.dll into Debuggers\x64.
# Delete this file before opening the PR.

name: Validate Debugging Tools ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/debugtools-arm64*'

jobs:
  debugtools:
    runs-on: windows-11-arm
    timeout-minutes: 30

    env:
      KITS_ROOT: 'C:\Program Files (x86)\Windows Kits\10'

    steps:
      - uses: actions/checkout@v5

      - name: Environment + confirm x64 debuggers absent today
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          (Get-CimInstance Win32_OperatingSystem).OSArchitecture
          python --version
          Write-Host "x64   dbghelp present: $(Test-Path "$env:KITS_ROOT\Debuggers\x64\dbghelp.dll")"
          Write-Host "arm64 dbghelp present: $(Test-Path "$env:KITS_ROOT\Debuggers\arm64\dbghelp.dll")"

      - name: Fetch Chromium's real vs_toolchain.py + gn_helpers.py
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "chromium-build"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($f in @("vs_toolchain.py","gn_helpers.py")) {
            Invoke-WebRequest -UseBasicParsing `
              -Uri "https://raw.githubusercontent.com/chromium/chromium/main/build/$f" `
              -OutFile (Join-Path $dir $f)
          }
          Get-ChildItem $dir | ForEach-Object { Write-Host "  downloaded $($_.Name)" }
          "CHROMIUM_BUILD_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: BEFORE fix - arm64 target should already PASS
        shell: python
        run: |
          import os, sys, tempfile
          sdk = r"C:\Program Files (x86)\Windows Kits\10"
          os.environ["DEPOT_TOOLS_WIN_TOOLCHAIN"] = "0"
          os.environ["WINDOWSSDKDIR"] = sdk
          os.environ.setdefault("GYP_MSVS_OVERRIDE_PATH", sdk)
          sys.path.insert(0, os.environ["CHROMIUM_BUILD_DIR"])
          import vs_toolchain
          vs_toolchain._CopyDebugger(tempfile.mkdtemp(), "arm64")
          print("OK - arm64 target passes on the current image (as expected)")

      - name: BEFORE fix - x64 target must RAISE the reporter's exact error
        shell: python
        run: |
          import os, sys, tempfile
          sdk = r"C:\Program Files (x86)\Windows Kits\10"
          os.environ["DEPOT_TOOLS_WIN_TOOLCHAIN"] = "0"
          os.environ["WINDOWSSDKDIR"] = sdk
          os.environ.setdefault("GYP_MSVS_OVERRIDE_PATH", sdk)
          sys.path.insert(0, os.environ["CHROMIUM_BUILD_DIR"])
          import vs_toolchain
          try:
              vs_toolchain._CopyDebugger(tempfile.mkdtemp(), "x64")
          except Exception as e:
              msg = repr(e)
              print("RAISED:", msg)
              assert "Debugging Tools for Windows" in msg, "raised, but not the expected error"
              print("OK - reproduced the reporter's exact error with Chromium's real code")
              sys.exit(0)
          print("ERROR: x64 did NOT raise before the fix - not reproduced")
          sys.exit(1)

      - name: Apply the fix - copy SDK bin\x64\DbgHelp.dll into Debuggers\x64
        shell: pwsh
        run: |
          $src = Get-ChildItem "$env:KITS_ROOT\bin\*\x64\dbghelp.dll" -ErrorAction SilentlyContinue |
                 Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
          if (-not $src) { Write-Error "no x64 dbghelp.dll under SDK bin - cannot apply fix"; exit 1 }
          $dst = "$env:KITS_ROOT\Debuggers\x64"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item $src.FullName (Join-Path $dst "dbghelp.dll") -Force
          Write-Host "copied $($src.FullName) ($($src.VersionInfo.FileVersion)) -> $dst\dbghelp.dll"

      - name: AFTER fix - x64 target must now PASS (Chromium's real code)
        shell: python
        run: |
          import os, sys, tempfile
          sdk = r"C:\Program Files (x86)\Windows Kits\10"
          os.environ["DEPOT_TOOLS_WIN_TOOLCHAIN"] = "0"
          os.environ["WINDOWSSDKDIR"] = sdk
          os.environ.setdefault("GYP_MSVS_OVERRIDE_PATH", sdk)
          sys.path.insert(0, os.environ["CHROMIUM_BUILD_DIR"])
          import vs_toolchain
          target = tempfile.mkdtemp()
          vs_toolchain._CopyDebugger(target, "x64")
          copied = os.path.exists(os.path.join(target, "dbghelp.dll"))
          print("OK - x64 target passes after the fix; dbghelp copied to output =", copied)

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $x64 = Test-Path "$env:KITS_ROOT\Debuggers\x64\dbghelp.dll"
          @(
            "### #14061 end-to-end validation (Chromium vs_toolchain.py)",
            "",
            "| Check | Result |",
            "| --- | --- |",
            "| Runner | windows-11-arm |",
            "| arm64 target (before fix) | passes |",
            "| x64 target (before fix) | RAISES 'Debugging Tools for Windows' (reporter's error) |",
            "| Fix | copy SDK bin\x64 dbghelp.dll -> Debuggers\x64 |",
            "| x64 target (after fix) | passes |",
            "| x64 Debuggers\\dbghelp.dll now present | $x64 |"
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
