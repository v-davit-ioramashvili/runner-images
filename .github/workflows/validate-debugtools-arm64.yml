# TEMPORARY - validation aid for #14061.
# Runs on the hosted windows-11-arm runner (current production image, i.e. BEFORE the
# fix). Confirms the "Debugging Tools for Windows" (cdb.exe) feature of the 26100 SDK
# is absent today, dumps where the SDK bundle actually lives on ARM64 (the lookup that
# Sergei hit trouble with), then runs the EXACT production block from
# Install-VisualStudio.ps1 via the repo's Install-Binary, measures the on-disk cost and
# install time, and reproduces the Chromium gn/vs_toolchain.py check from the issue.
# Delete this file before opening the PR.

name: Validate Debugging Tools ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/debugtools-arm64*'

jobs:
  debugtools:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Record arch, SDK, and per-arch Debuggers state BEFORE the fix
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          $osa = (Get-CimInstance Win32_OperatingSystem).OSArchitecture
          Write-Host "OSArchitecture         = $osa"
          if ($osa -notmatch "ARM 64-bit") { Write-Error "not an arm64 runner"; exit 1 }

          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          Write-Host "--- installed SDK versions under $kitsRoot\bin ---"
          Get-ChildItem "$kitsRoot\bin" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^10\.' } | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Test-Path "$kitsRoot\bin\10.0.26100.0")) {
            Write-Error "Windows 11 SDK 10.0.26100 not present - unexpected on this image"; exit 1
          }
          Write-Host "OK - SDK 10.0.26100 present (matches the issue)"

          # Per-arch cdb.exe state BEFORE. On the current image arm64 ships but x64 does not.
          Write-Host "--- Debuggers per-arch BEFORE ---"
          foreach ($arch in @("x86","x64","arm","arm64")) {
            $present = Test-Path "$kitsRoot\Debuggers\$arch\cdb.exe"
            Write-Host "  $arch cdb.exe : $present"
            "BEFORE_$arch=$present" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          # x64 is the gap the reporter's Chromium build hits; do NOT fail here, we install it below.

      - name: Diagnose where the SDK bundle lives on ARM64 (the BundleCachePath lookup)
        shell: pwsh
        run: |
          Write-Host "--- 32-bit view: HKLM\Software\Wow6432Node\...\Uninstall (production lookup) ---"
          Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Windows Software Development Kit' } |
            Select-Object DisplayName, DisplayVersion, BundleCachePath | Format-List

          Write-Host "--- 64-bit view: HKLM\Software\...\Uninstall (fallback, in case arm64 differs) ---"
          Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Windows Software Development Kit' } |
            Select-Object DisplayName, DisplayVersion, BundleCachePath | Format-List

          Write-Host "--- any winsdksetup.exe cached under Package Cache ---"
          Get-ChildItem 'C:\ProgramData\Package Cache' -Recurse -Filter 'winsdksetup.exe' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Measure disk before
        shell: pwsh
        run: |
          $used = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").Size - (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          Write-Host "used bytes before: $used"
          "DISK_BEFORE=$used" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Candidate fix (no download): the SDK's own x64 DbgHelp.dll already ships under
      # Windows Kits\10\bin\<ver>\x64. Chromium reads from Debuggers\x64, which is empty.
      # Copy the SDK bin x64 debugger DLLs into Debuggers\x64. dbghelp.dll is the only file
      # Chromium hard-requires; dbgcore.dll / symsrv.dll are optional (copied if present).
      - name: Populate Debuggers\x64 from the SDK's bin\x64 (copy-based fix)
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $sdkVer   = "10.0.26100.0"
          $srcDir   = "$kitsRoot\bin\$sdkVer\x64"
          $dstDir   = "$kitsRoot\Debuggers\x64"
          New-Item -ItemType Directory -Force -Path $dstDir | Out-Null

          # DbgHelp.dll is on-disk as mixed-case; Chromium looks up 'dbghelp.dll' (Windows FS
          # is case-insensitive so this is fine). Copy the three files Chromium may want.
          $copied = @()
          foreach ($f in @("dbghelp.dll","dbgcore.dll","symsrv.dll")) {
            $src = Join-Path $srcDir $f
            if (Test-Path $src) {
              Copy-Item $src (Join-Path $dstDir $f) -Force
              $copied += "$f ($((Get-Item $src).VersionInfo.FileVersion))"
            } else {
              Write-Host "  not present in bin\x64: $f"
            }
          }
          Write-Host "copied into Debuggers\x64: $($copied -join '; ')"

          $sw.Stop()
          "INSTALL_SECONDS=$([int]$sw.Elapsed.TotalSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "copy took $($sw.Elapsed.TotalMilliseconds) ms"

      - name: Measure the on-disk cost
        shell: pwsh
        run: |
          $used = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").Size - (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          $delta = $used - [int64]$env:DISK_BEFORE
          $deltaMiB = [math]::Round($delta / 1MB, 1)
          Write-Host "disk delta: $deltaMiB MiB"
          "DISK_DELTA_MIB=$deltaMiB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $dbgRoot = "C:\Program Files (x86)\Windows Kits\10\Debuggers"
          if (Test-Path $dbgRoot) {
            $folderBytes = (Get-ChildItem $dbgRoot -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            $folderMiB = [math]::Round($folderBytes / 1MB, 1)
            Write-Host "Debuggers folder size: $folderMiB MiB"
            "DBG_FOLDER_MIB=$folderMiB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Verify the files Chromium's vs_toolchain.py ACTUALLY requires (dbghelp/dbgcore)
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $x64dir = "$kitsRoot\Debuggers\x64"

          Write-Host "--- full contents of Debuggers\x64 after the copy ---"
          if (Test-Path $x64dir) {
            Get-ChildItem $x64dir -File -ErrorAction SilentlyContinue | Select-Object Name,@{n='KB';e={[int]($_.Length/1KB)}} | Format-Table -AutoSize | Out-String | Write-Host
          } else { Write-Host "  (Debuggers\x64 does not exist)" }

          # dbghelp.dll is the ONLY file Chromium hard-requires (raises if missing);
          # dbgcore.dll and symsrv.dll are optional (skipped if absent).
          Write-Host "--- Chromium files per arch (x64 dbghelp is mandatory) ---"
          foreach ($arch in @("x64","arm64")) {
            foreach ($f in @("dbghelp.dll","dbgcore.dll","symsrv.dll")) {
              Write-Host "  $arch\$f : $(Test-Path "$kitsRoot\Debuggers\$arch\$f")"
            }
          }
          $x64dbghelp = "$kitsRoot\Debuggers\x64\dbghelp.dll"
          if (-not (Test-Path $x64dbghelp)) { Write-Error "MANDATORY x64 dbghelp.dll still missing - fix failed"; exit 1 }
          Write-Host "OK - Debuggers\x64\dbghelp.dll present ($((Get-Item $x64dbghelp).VersionInfo.FileVersion)) -> Chromium's mandatory check passes"

      - name: Reproduce the issue check (Chromium gn / vs_toolchain.py)
        shell: pwsh
        run: |
          # vs_toolchain.py's _CopyDebugger raises "You must install ... 'Debugging Tools
          # for Windows' feature" when Debuggers\<target_cpu>\dbghelp.dll is absent.
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          # The arm64 build copies debuggers for BOTH arm64 and its win_clang_x64 host -> it
          # needs Debuggers\x64\dbghelp.dll AND Debuggers\arm64\dbghelp.dll. Both mandatory.
          $ok = $true
          foreach ($p in @("$kitsRoot\Debuggers\x64\dbghelp.dll","$kitsRoot\Debuggers\arm64\dbghelp.dll")) {
            $present = Test-Path $p
            Write-Host "  $p : $present"
            if (-not $present) { $ok = $false }
          }
          if (-not $ok) { Write-Error "Chromium's Debugging Tools check would still fail"; exit 1 }
          Write-Host "OK - both arm64 and x64 dbghelp.dll present -> an arm64 Chromium build passes the check"

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $x64After = Test-Path "$kitsRoot\Debuggers\x64\dbghelp.dll"
          $rows = @(
            "### Debugging Tools for Windows - ARM64 validation (copy-based fix)",
            "",
            "| Metric | Value |",
            "| --- | --- |",
            "| Runner | windows-11-arm |",
            "| SDK present | 10.0.26100 |",
            "| Fix | copy SDK bin\x64\DbgHelp.dll -> Debuggers\x64\dbghelp.dll |",
            "| x64 Debuggers\\dbghelp.dll *before* | False (the gap #14061 hits) |",
            "| x64 Debuggers\\dbghelp.dll *after*  | $(if ($x64After) {'present'} else {'FAILED'}) |",
            "| Fix time | $($env:INSTALL_SECONDS)s (file copy) |",
            "| Disk delta (whole C:) | $($env:DISK_DELTA_MIB) MiB |"
          )
          $rows -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
