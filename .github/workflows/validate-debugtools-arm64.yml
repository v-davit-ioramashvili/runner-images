# TEMPORARY - validation aid for #14061.
# Runs on the hosted windows-11-arm runner (current production image, i.e. BEFORE the
# fix). Confirms the "Debugging Tools for Windows" (cdb.exe) feature of the 26100 SDK
# is absent today, dumps where the SDK bundle actually lives on ARM64 (the lookup that
# Sergei hit trouble with), then runs the EXACT production block from
# Install-VisualStudio.ps1 via the repo's Install-Binary, measures the on-disk cost and
# install time, and reproduces the Chromium gn/vs_toolchain.py check from the issue.
# Delete this file before opening the PR.

name: Validate Debugging Tools ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/debugtools-arm64*'

jobs:
  debugtools:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Record arch, SDK, and per-arch Debuggers state BEFORE the fix
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          $osa = (Get-CimInstance Win32_OperatingSystem).OSArchitecture
          Write-Host "OSArchitecture         = $osa"
          if ($osa -notmatch "ARM 64-bit") { Write-Error "not an arm64 runner"; exit 1 }

          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          Write-Host "--- installed SDK versions under $kitsRoot\bin ---"
          Get-ChildItem "$kitsRoot\bin" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^10\.' } | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Test-Path "$kitsRoot\bin\10.0.26100.0")) {
            Write-Error "Windows 11 SDK 10.0.26100 not present - unexpected on this image"; exit 1
          }
          Write-Host "OK - SDK 10.0.26100 present (matches the issue)"

          # Per-arch cdb.exe state BEFORE. On the current image arm64 ships but x64 does not.
          Write-Host "--- Debuggers per-arch BEFORE ---"
          foreach ($arch in @("x86","x64","arm","arm64")) {
            $present = Test-Path "$kitsRoot\Debuggers\$arch\cdb.exe"
            Write-Host "  $arch cdb.exe : $present"
            "BEFORE_$arch=$present" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          # x64 is the gap the reporter's Chromium build hits; do NOT fail here, we install it below.

      - name: Diagnose where the SDK bundle lives on ARM64 (the BundleCachePath lookup)
        shell: pwsh
        run: |
          Write-Host "--- 32-bit view: HKLM\Software\Wow6432Node\...\Uninstall (production lookup) ---"
          Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Windows Software Development Kit' } |
            Select-Object DisplayName, DisplayVersion, BundleCachePath | Format-List

          Write-Host "--- 64-bit view: HKLM\Software\...\Uninstall (fallback, in case arm64 differs) ---"
          Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Windows Software Development Kit' } |
            Select-Object DisplayName, DisplayVersion, BundleCachePath | Format-List

          Write-Host "--- any winsdksetup.exe cached under Package Cache ---"
          Get-ChildItem 'C:\ProgramData\Package Cache' -Recurse -Filter 'winsdksetup.exe' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Measure disk before
        shell: pwsh
        run: |
          $used = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").Size - (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          Write-Host "used bytes before: $used"
          "DISK_BEFORE=$used" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # NOTE: The plain production block (winsdksetup /features OptionId.WindowsDesktopDebuggers)
      # was proven in run 32257158212 to run cleanly (66s, +59.7 MiB) yet NOT install the x64
      # debuggers on an arm64 host - it only refreshes native (arm64) + x86. That is Sergei's
      # earlier "problem". This step validates the arch-agnostic method: /layout the debuggers
      # payload, then msiexec the x64 debuggers MSI directly.
      - name: Install x64 Debugging Tools via SDK layout + msiexec (arm64-capable method)
        shell: pwsh
        run: |
          $installerEntry = Get-ItemProperty HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* `
              | Where-Object { $_.DisplayName -match "Windows Software Development Kit" } `
              | Sort-Object DisplayVersion -Descending | Select-Object -First 1
          if (-not ($installerEntry -and $installerEntry.BundleCachePath)) { throw "SDK BundleCachePath not found" }
          $setup = $installerEntry.BundleCachePath
          Write-Host "setup = $setup"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()

          # 1) Download only the debuggers-feature payloads into an offline layout
          $layout = Join-Path $env:RUNNER_TEMP "sdk-dbg-layout"
          Write-Host "--- winsdksetup /layout $layout ---"
          $p = Start-Process -FilePath $setup -ArgumentList "/features","OptionId.WindowsDesktopDebuggers","/quiet","/norestart","/layout","`"$layout`"" -Wait -PassThru -NoNewWindow
          Write-Host "layout exit code: $($p.ExitCode)"

          # 2) Find the debugger MSIs that were laid down
          Write-Host "--- debugger MSIs in layout ---"
          $msis = Get-ChildItem $layout -Recurse -Filter *.msi -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match 'Debugg' }
          $msis | ForEach-Object { Write-Host "  $($_.Name)" }

          $x64msi = $msis | Where-Object { $_.Name -match 'x64' } | Select-Object -First 1
          if (-not $x64msi) { throw "x64 debuggers MSI not found in layout - dumping all MSIs:`n" + ((Get-ChildItem $layout -Recurse -Filter *.msi | Select-Object -Expand Name) -join "`n") }
          Write-Host "installing: $($x64msi.FullName)"

          # 3) Install the x64 debuggers MSI (host-arch agnostic - plain payload copy)
          $m = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i","`"$($x64msi.FullName)`"","/quiet","/norestart" -Wait -PassThru
          Write-Host "msiexec exit code: $($m.ExitCode)"
          if ($m.ExitCode -ne 0 -and $m.ExitCode -ne 3010) { throw "msiexec failed ($($m.ExitCode))" }

          $sw.Stop()
          "INSTALL_SECONDS=$([int]$sw.Elapsed.TotalSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "layout + x64 MSI install took $([int]$sw.Elapsed.TotalSeconds)s"

      - name: Measure the on-disk cost
        shell: pwsh
        run: |
          $used = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").Size - (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          $delta = $used - [int64]$env:DISK_BEFORE
          $deltaMiB = [math]::Round($delta / 1MB, 1)
          Write-Host "disk delta: $deltaMiB MiB"
          "DISK_DELTA_MIB=$deltaMiB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $dbgRoot = "C:\Program Files (x86)\Windows Kits\10\Debuggers"
          if (Test-Path $dbgRoot) {
            $folderBytes = (Get-ChildItem $dbgRoot -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            $folderMiB = [math]::Round($folderBytes / 1MB, 1)
            Write-Host "Debuggers folder size: $folderMiB MiB"
            "DBG_FOLDER_MIB=$folderMiB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Locate where the x64 debuggers actually landed (disk-wide, non-fatal)
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          Write-Host "--- Debuggers per-arch in the x86 KitsRoot (what Chromium reads) ---"
          foreach ($arch in @("x86","x64","arm","arm64")) {
            Write-Host "  $arch cdb.exe : $(Test-Path "$kitsRoot\Debuggers\$arch\cdb.exe")"
          }

          Write-Host "--- EVERY cdb.exe on disk (to find where the x64 MSI put it) ---"
          foreach ($root in @("C:\Program Files\Windows Kits","C:\Program Files (x86)\Windows Kits")) {
            if (Test-Path $root) {
              Get-ChildItem $root -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "  $($_.FullName)" }
            }
          }

          Write-Host "--- registry KitsRoot values ---"
          $rk = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots' -ErrorAction SilentlyContinue
          if ($rk) { $rk.PSObject.Properties | Where-Object { $_.Name -match 'KitsRoot' } | ForEach-Object { Write-Host "  $($_.Name) = $($_.Value)" } }

          Write-Host "--- newest large dirs under both Program Files 'Windows Kits' Debuggers ---"
          foreach ($dbg in @("C:\Program Files\Windows Kits\10\Debuggers","C:\Program Files (x86)\Windows Kits\10\Debuggers")) {
            if (Test-Path $dbg) {
              $sz = [math]::Round(((Get-ChildItem $dbg -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum)/1MB,1)
              Write-Host "  $dbg  =>  $sz MiB ; arch dirs: $((Get-ChildItem $dbg -Directory -EA SilentlyContinue).Name -join ', ')"
            }
          }

      - name: Reproduce the issue check (Chromium gn / vs_toolchain.py)
        shell: pwsh
        run: |
          # vs_toolchain.py errors "You must install ... including the 'Debugging Tools
          # for Windows' feature" when the Debuggers dir for the target arch is absent.
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $need = @("$kitsRoot\Debuggers\x64", "$kitsRoot\Debuggers\arm64")
          $ok = $true
          foreach ($d in $need) {
            $present = Test-Path "$d\cdb.exe"
            Write-Host "  $d\cdb.exe : $present"
            if (-not $present) { $ok = $false }
          }
          if (-not $ok) { Write-Host "NOTE: Chromium's Debugging Tools check would still fail (diagnostic run - see locate step)" }
          else { Write-Host "OK - the folders Chromium's vs_toolchain.py checks for are now present" }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $x64After = Test-Path "$kitsRoot\Debuggers\x64\cdb.exe"
          $armAfter = Test-Path "$kitsRoot\Debuggers\arm64\cdb.exe"
          $rows = @(
            "### Debugging Tools for Windows - ARM64 validation",
            "",
            "| Metric | Value |",
            "| --- | --- |",
            "| Runner | windows-11-arm |",
            "| SDK present | 10.0.26100 |",
            "| arm64 cdb.exe *before* fix | $($env:BEFORE_arm64) (already shipped) |",
            "| x64 cdb.exe *before* fix | $($env:BEFORE_x64) (the gap #14061 hits) |",
            "| x64 cdb.exe *after* fix | $(if ($x64After) {'installed'} else {'FAILED'}) |",
            "| arm64 cdb.exe *after* fix | $(if ($armAfter) {'present'} else {'FAILED'}) |",
            "| Install time | $($env:INSTALL_SECONDS)s |",
            "| Disk delta (whole C:) | $($env:DISK_DELTA_MIB) MiB |",
            "| Debuggers folder size | $($env:DBG_FOLDER_MIB) MiB |"
          )
          $rows -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
