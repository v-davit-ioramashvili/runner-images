# TEMPORARY - validation aid for #14061.
# Runs on the hosted windows-11-arm runner (current production image, i.e. BEFORE the
# fix). Confirms the "Debugging Tools for Windows" (cdb.exe) feature of the 26100 SDK
# is absent today, dumps where the SDK bundle actually lives on ARM64 (the lookup that
# Sergei hit trouble with), then runs the EXACT production block from
# Install-VisualStudio.ps1 via the repo's Install-Binary, measures the on-disk cost and
# install time, and reproduces the Chromium gn/vs_toolchain.py check from the issue.
# Delete this file before opening the PR.

name: Validate Debugging Tools ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/debugtools-arm64*'

jobs:
  debugtools:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Confirm arch, that the 26100 SDK is present, and that cdb.exe is absent today
        shell: pwsh
        run: |
          Write-Host "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          $osa = (Get-CimInstance Win32_OperatingSystem).OSArchitecture
          Write-Host "OSArchitecture         = $osa"
          if ($osa -notmatch "ARM 64-bit") { Write-Error "not an arm64 runner"; exit 1 }

          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          Write-Host "--- installed SDK versions under $kitsRoot\bin ---"
          Get-ChildItem "$kitsRoot\bin" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^10\.' } | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Test-Path "$kitsRoot\bin\10.0.26100.0")) {
            Write-Error "Windows 11 SDK 10.0.26100 not present - unexpected on this image"; exit 1
          }
          Write-Host "OK - SDK 10.0.26100 present (matches the issue)"

          $cdbArm = "$kitsRoot\Debuggers\arm64\cdb.exe"
          $cdbX64 = "$kitsRoot\Debuggers\x64\cdb.exe"
          Write-Host "--- Debuggers before ---"
          Write-Host "  arm64 cdb.exe : $(Test-Path $cdbArm)"
          Write-Host "  x64   cdb.exe : $(Test-Path $cdbX64)"
          if ((Test-Path $cdbArm) -or (Test-Path $cdbX64)) {
            Write-Error "Debugging Tools already present - unexpected on the current image"; exit 1
          }
          Write-Host "OK - Debugging Tools for Windows are NOT installed (matches #14061)"

      - name: Diagnose where the SDK bundle lives on ARM64 (the BundleCachePath lookup)
        shell: pwsh
        run: |
          Write-Host "--- 32-bit view: HKLM\Software\Wow6432Node\...\Uninstall (production lookup) ---"
          Get-ItemProperty 'HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Windows Software Development Kit' } |
            Select-Object DisplayName, DisplayVersion, BundleCachePath | Format-List

          Write-Host "--- 64-bit view: HKLM\Software\...\Uninstall (fallback, in case arm64 differs) ---"
          Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -match 'Windows Software Development Kit' } |
            Select-Object DisplayName, DisplayVersion, BundleCachePath | Format-List

          Write-Host "--- any winsdksetup.exe cached under Package Cache ---"
          Get-ChildItem 'C:\ProgramData\Package Cache' -Recurse -Filter 'winsdksetup.exe' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Measure disk before
        shell: pwsh
        run: |
          $used = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").Size - (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          Write-Host "used bytes before: $used"
          "DISK_BEFORE=$used" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the EXACT production block from Install-VisualStudio.ps1
        shell: pwsh
        run: |
          . "$env:GITHUB_WORKSPACE\images\windows\scripts\helpers\InstallHelpers.ps1"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()

          # --- verbatim from images/windows/scripts/build/Install-VisualStudio.ps1 ---
          $installerEntry = Get-ItemProperty HKLM:\Software\Wow6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* `
              | Where-Object { $_.DisplayName -match "Windows Software Development Kit" } `
              | Sort-Object DisplayVersion -Descending | Select-Object -First 1

          if ($installerEntry -and $installerEntry.BundleCachePath) {
              Write-Host "BundleCachePath = $($installerEntry.BundleCachePath)"
              Install-Binary -Type EXE `
                  -LocalPath $installerEntry.BundleCachePath `
                  -InstallArgs @("/features", "OptionId.WindowsDesktopDebuggers", "/q", "/norestart") `
                  -ExpectedSubject $(Get-MicrosoftPublisher)
          }
          # --- end verbatim ---

          $sw.Stop()
          "INSTALL_SECONDS=$([int]$sw.Elapsed.TotalSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "install block took $([int]$sw.Elapsed.TotalSeconds)s"

          # Fail loudly if the production lookup found nothing (this is Sergei's suspected arm64 gap)
          if (-not ($installerEntry -and $installerEntry.BundleCachePath)) {
              Write-Error "BundleCachePath was null on arm64 - the production lookup does NOT resolve here. See the diagnose step for the real path."
              exit 1
          }

      - name: Measure the on-disk cost
        shell: pwsh
        run: |
          $used = (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").Size - (Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'").FreeSpace
          $delta = $used - [int64]$env:DISK_BEFORE
          $deltaMiB = [math]::Round($delta / 1MB, 1)
          Write-Host "disk delta: $deltaMiB MiB"
          "DISK_DELTA_MIB=$deltaMiB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $dbgRoot = "C:\Program Files (x86)\Windows Kits\10\Debuggers"
          if (Test-Path $dbgRoot) {
            $folderBytes = (Get-ChildItem $dbgRoot -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            $folderMiB = [math]::Round($folderBytes / 1MB, 1)
            Write-Host "Debuggers folder size: $folderMiB MiB"
            "DBG_FOLDER_MIB=$folderMiB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Verify cdb.exe works (the tool the reporter needs)
        shell: pwsh
        run: |
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          Write-Host "--- Debuggers after ---"
          Get-ChildItem "$kitsRoot\Debuggers" -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  arch dir: $($_.Name)" }

          $cdbArm = "$kitsRoot\Debuggers\arm64\cdb.exe"
          $cdbX64 = "$kitsRoot\Debuggers\x64\cdb.exe"
          foreach ($cdb in @($cdbArm, $cdbX64)) {
            if (Test-Path $cdb) {
              Write-Host "found: $cdb"
              & $cdb -version 2>&1 | Select-Object -First 3 | ForEach-Object { Write-Host "  $_" }
            } else {
              Write-Host "MISSING: $cdb"
            }
          }
          if (-not (Test-Path $cdbArm)) { Write-Error "arm64 cdb.exe missing after install"; exit 1 }
          Write-Host "OK - arm64 cdb.exe installed"

      - name: Reproduce the issue check (Chromium gn / vs_toolchain.py)
        shell: pwsh
        run: |
          # vs_toolchain.py errors "You must install ... including the 'Debugging Tools
          # for Windows' feature" when the Debuggers dir for the target arch is absent.
          $kitsRoot = "C:\Program Files (x86)\Windows Kits\10"
          $need = @("$kitsRoot\Debuggers\x64", "$kitsRoot\Debuggers\arm64")
          $ok = $true
          foreach ($d in $need) {
            $present = Test-Path "$d\cdb.exe"
            Write-Host "  $d\cdb.exe : $present"
            if (-not $present) { $ok = $false }
          }
          if (-not $ok) { Write-Error "Chromium's Debugging Tools check would still fail"; exit 1 }
          Write-Host "OK - the folders Chromium's vs_toolchain.py checks for are now present"

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $cdbArm = Test-Path "C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64\cdb.exe"
          $rows = @(
            "### Debugging Tools for Windows - ARM64 validation",
            "",
            "| Metric | Value |",
            "| --- | --- |",
            "| Runner | windows-11-arm |",
            "| SDK present | 10.0.26100 |",
            "| CDB present *before* fix | No (as reported in #14061) |",
            "| arm64 cdb.exe *after* fix | $(if ($cdbArm) {'installed'} else {'FAILED'}) |",
            "| Install time | $($env:INSTALL_SECONDS)s |",
            "| Disk delta (whole C:) | $($env:DISK_DELTA_MIB) MiB |",
            "| Debuggers folder size | $($env:DBG_FOLDER_MIB) MiB |"
          )
          $rows -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
