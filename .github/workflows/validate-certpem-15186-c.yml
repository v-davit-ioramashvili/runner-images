name: validate-brew-cacert-15191
on:
  push:
    branches: [validate/15186-certpem]
  workflow_dispatch:

jobs:
  upgrade:
    name: upgrade (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26-intel]
    steps:
      - name: Interim workaround - brew upgrade ca-certificates
        run: |
          set +e
          B=$(brew --prefix)
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion HOMEBREW_NO_AUTO_UPDATE=${HOMEBREW_NO_AUTO_UPDATE:-unset}"
          check() {
            echo "== $1: $(brew --version | head -1), $(brew list --versions ca-certificates)"
            for f in "$B/opt/ca-certificates/share/ca-certificates/cacert.pem" "$B/etc/ca-certificates/cert.pem"; do
              echo "  $f: $(openssl crl2pkcs7 -nocrl -certfile "$f" | openssl pkcs7 -print_certs -noout | grep -cE 'subject=.*(emSign ECC Root CA - G3|AAA Certificate Services)') affected roots"
            done
            for h in dv-g3b-emudhra dv-g3b-aaa-emudhra; do
              "$B/opt/curl/bin/curl" -sS -o /dev/null --max-time 30 "https://$h.we-have-a-problem.com/" 2>/dev/null && echo "  brew curl $h ACCEPT" || echo "  brew curl $h REJECT"
            done
          }
          check stock
          echo "--- 1. plain brew upgrade ca-certificates (image env)"
          start=$SECONDS; brew upgrade ca-certificates 2>&1 | tail -5; echo "rc=${PIPESTATUS[0]} took $((SECONDS-start))s"
          check after-plain-upgrade
          echo "--- 2. HOMEBREW_NO_AUTO_UPDATE= brew upgrade ca-certificates (refresh API, no brew self-update)"
          start=$SECONDS; HOMEBREW_NO_AUTO_UPDATE= HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1 brew upgrade ca-certificates 2>&1 | tail -8; echo "rc=${PIPESTATUS[0]} took $((SECONDS-start))s"
          check after-api-refresh-upgrade
