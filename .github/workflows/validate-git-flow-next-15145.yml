name: Validate git-flow-next runtime install (#15145)

on:
  push:
    branches: [validate/15145-git-flow-next]

jobs:
  # Exact GitHub Actions snippet from 15145-reply.md, then use from every shell in later steps.
  snippet-gha:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install git-flow-next
        shell: pwsh
        run: |
          $version = '2.1.0'
          $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
          $zip = "git-flow-next-v$version-windows-$arch.zip"
          $dir = "$env:RUNNER_TEMP\git-flow-next"
          Invoke-WebRequest "https://github.com/gittower/git-flow-next/releases/download/v$version/$zip" -OutFile "$env:RUNNER_TEMP\$zip"
          Expand-Archive "$env:RUNNER_TEMP\$zip" -DestinationPath $dir -Force
          $dir | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - run: git flow version
      - name: Image, archive contents and cmd/bash
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion arch=$env:PROCESSOR_ARCHITECTURE"
          Get-ChildItem "$env:RUNNER_TEMP\git-flow-next" | Format-Table Name, Length -AutoSize | Out-String
          (Get-Command git-flow).Source
          cmd /c "git flow version"
          bash -lc "git flow version"
      - name: Functional test
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name ci && git config --global user.email ci@example.com
          git config --global init.defaultBranch main
          cd "$RUNNER_TEMP" && mkdir repo && cd repo
          git init -q && git commit -q --allow-empty -m init
          git flow init --defaults
          git flow feature start demo
          git commit -q --allow-empty -m "feature work"
          git flow feature finish demo
          test "$(git branch --show-current)" = develop
          git log --oneline develop | grep -q "feature work"
          echo "functional test passed"

  # Azure DevOps snippet body with AGENT_TEMPDIRECTORY set; the emitted prependpath is applied via GITHUB_PATH.
  snippet-ado-emulated:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      AGENT_TEMPDIRECTORY: ${{ runner.temp }}
    steps:
      - name: ADO script body
        shell: pwsh
        run: |
          $out = & {
            $version = '2.1.0'
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'amd64' }
            $zip = "git-flow-next-v$version-windows-$arch.zip"
            $dir = "$env:AGENT_TEMPDIRECTORY\git-flow-next"
            Invoke-WebRequest "https://github.com/gittower/git-flow-next/releases/download/v$version/$zip" -OutFile "$env:AGENT_TEMPDIRECTORY\$zip"
            Expand-Archive "$env:AGENT_TEMPDIRECTORY\$zip" -DestinationPath $dir -Force
            Write-Host "##vso[task.prependpath]$dir"
          } 6>&1
          $out = $out | ForEach-Object { "$_" }
          $out
          $path = ($out | Select-String '^##vso\[task\.prependpath\](.+)$').Matches[0].Groups[1].Value
          $path | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: script step (cmd)
        shell: cmd
        run: git flow version

  # winget as the reporter wrote it; is git flow usable in a later step from pwsh and cmd?
  winget:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Reporter's winget command
        continue-on-error: true
        shell: pwsh
        run: |
          winget install --id GitTower.GitFlowNext --exact --silent --accept-package-agreements --accept-source-agreements
          "winget exit: $LASTEXITCODE"
      - name: Later step (pwsh)
        continue-on-error: true
        shell: pwsh
        run: git flow version
      - name: Later step (cmd)
        continue-on-error: true
        shell: cmd
        run: git flow version

  # Parity: does any Linux or macOS image ship git-flow?
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "$ImageOS $ImageVersion"
          command -v git-flow || echo "git-flow: not on PATH"
          git flow version || true
