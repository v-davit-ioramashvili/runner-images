# TEMPORARY - validation aid for #14049.
# Two things, on windows-latest (x64) AND windows-11-arm:
#   1. Ground truth: the canonical session signals (UserInteractive, session vs
#      active-console id, window station) - is the desktop actually interactive?
#   2. Faithful repro of the reporter's exact stack: .NET 10 Desktop Runtime +
#      Python 3.12 + Python.NET, running their verbatim demo.py, PLUS a corrected
#      variant that pumps a real message loop - to show whether the FAILURE is in
#      the environment or in their test's methodology.
# Delete this file before opening any PR.

name: Validate Interactive Session 14049

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/interactive-session-14049*'

jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Ground truth - canonical interactivity signals
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class Native {
              [DllImport("kernel32.dll")] public static extern uint WTSGetActiveConsoleSessionId();
              [DllImport("kernel32.dll")] public static extern uint GetCurrentProcessId();
              [DllImport("kernel32.dll")] public static extern bool ProcessIdToSessionId(uint dwProcessId, out uint pSessionId);
              [DllImport("user32.dll")] public static extern IntPtr GetProcessWindowStation();
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern bool GetUserObjectInformation(IntPtr hObj, int nIndex, StringBuilder pvInfo, int nLength, out int lpnLengthNeeded);
              public static string ObjName(IntPtr hObj) {
                  int needed; var sb = new StringBuilder(256);
                  GetUserObjectInformation(hObj, 2, sb, sb.Capacity, out needed);
                  return sb.ToString();
              }
          }
          "@
          $procSession = 0
          [void][Native]::ProcessIdToSessionId([Native]::GetCurrentProcessId(), [ref]$procSession)
          Write-Host "OS leg / arch          : ${{ matrix.os }} / $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Environment.UserInteractive : $([System.Environment]::UserInteractive)"
          Write-Host "Process session id     : $procSession"
          Write-Host "Active console session : $([Native]::WTSGetActiveConsoleSessionId())"
          Write-Host "Window station         : $([Native]::ObjName([Native]::GetProcessWindowStation()))  (WinSta0 = interactive)"

      - name: Install .NET 10 Desktop Runtime (matches the reporter's step)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = "$env:RUNNER_TEMP\dotnet"
          Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
          # base runtime (brings the host + dotnet.exe muxer + Microsoft.NETCore.App)
          & "$env:RUNNER_TEMP\dotnet-install.ps1" -Runtime dotnet -Channel 10.0 -InstallDir $root
          # WindowsDesktop shared framework on top, same root
          & "$env:RUNNER_TEMP\dotnet-install.ps1" -Runtime windowsdesktop -Channel 10.0 -InstallDir $root
          "DOTNET_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installed runtimes:"
          & "$root\dotnet.exe" --list-runtimes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python.NET
        shell: powershell
        run: python -m pip install --disable-pip-version-check pythonnet

      - name: Reporter's EXACT demo.py (verbatim from the issue)
        shell: powershell
        run: |
          $demo = @'
          import sys
          from pathlib import Path
          import clr_loader
          from pythonnet import set_runtime
          runtime_json = Path(__file__).parent / "runtime.json"
          runtime_json.write_text("""
          {
            "runtimeOptions": {
              "tfm": "net10.0-windows",
              "frameworks": [
                { "name": "Microsoft.NETCore.App", "version": "10.0.0" },
                { "name": "Microsoft.WindowsDesktop.App", "version": "10.0.0" }
              ]
            }
          }
          """)
          set_runtime(clr_loader.get_coreclr(runtime_config=runtime_json))
          import clr
          clr.AddReference("System.Windows.Forms")
          import System.Windows.Forms as WinForms

          def main():
              form = WinForms.Form()
              form.Text = "Interactive Desktop Test"
              form.Show()
              WinForms.Application.DoEvents()
              form.Activate()
              WinForms.Application.DoEvents()
              active = WinForms.Form.ActiveForm
              print(f"Form.Visible:         {form.Visible}")
              print(f"Form.IsHandleCreated: {form.IsHandleCreated}")
              print(f"Form.ActiveForm:      {active}")
              if active is not None:
                  print("RESULT: Interactive desktop session detected.")
                  rc = 0
              else:
                  print("RESULT: Non-interactive session detected.")
                  rc = 1
              form.Close(); form.Dispose()
              return rc

          if __name__ == "__main__":
              sys.exit(main())
          '@
          Set-Content -Path "$env:RUNNER_TEMP\demo.py" -Value $demo -Encoding utf8
          python "$env:RUNNER_TEMP\demo.py"
          Write-Host "reporter demo.py exit code: $LASTEXITCODE"
          exit 0

      - name: Corrected probe - same .NET 10 stack, proper message loop
        shell: powershell
        run: |
          $fix = @'
          from pathlib import Path
          import clr_loader
          from pythonnet import set_runtime
          runtime_json = Path(r"__TMP__") / "runtime2.json"
          runtime_json.write_text("""
          { "runtimeOptions": { "tfm": "net10.0-windows", "frameworks": [
            { "name": "Microsoft.NETCore.App", "version": "10.0.0" },
            { "name": "Microsoft.WindowsDesktop.App", "version": "10.0.0" } ] } }
          """)
          set_runtime(clr_loader.get_coreclr(runtime_config=runtime_json))
          import clr
          clr.AddReference("System.Windows.Forms")
          from System import Environment
          import System.Windows.Forms as WinForms

          # (a) interactivity, measured from INSIDE the .NET 10 process
          print(f"[.NET 10] Environment.UserInteractive: {Environment.UserInteractive}")

          # (b) the reporter's check, but with a real message pump instead of Show()+DoEvents
          result = {"active": None}
          form = WinForms.Form()
          form.Text = "probe"
          def on_shown(sender, args):
              form.Activate()
              result["active"] = WinForms.Form.ActiveForm
              form.Close()
          form.Shown += on_shown
          WinForms.Application.Run(form)
          a = result["active"]
          print(f"[corrected] Form.ActiveForm with a real message loop: {a}")
          print("[corrected] => interactive session" if a is not None else "[corrected] => still null")
          '@
          $fix = $fix.Replace("__TMP__", $env:RUNNER_TEMP)
          Set-Content -Path "$env:RUNNER_TEMP\fix.py" -Value $fix -Encoding utf8
          python "$env:RUNNER_TEMP\fix.py"
          Write-Host "corrected probe exit code: $LASTEXITCODE"
          exit 0

      - name: Win32-level probe - is it WinForms or the WoA window manager?
        shell: powershell
        run: |
          $w32 = @'
          from pathlib import Path
          import ctypes
          from ctypes import wintypes
          import clr_loader
          from pythonnet import set_runtime
          runtime_json = Path(r"__TMP__") / "runtime3.json"
          runtime_json.write_text("""
          { "runtimeOptions": { "tfm": "net10.0-windows", "frameworks": [
            { "name": "Microsoft.NETCore.App", "version": "10.0.0" },
            { "name": "Microsoft.WindowsDesktop.App", "version": "10.0.0" } ] } }
          """)
          set_runtime(clr_loader.get_coreclr(runtime_config=runtime_json))
          import clr
          clr.AddReference("System.Windows.Forms")
          import System.Windows.Forms as WinForms

          user32 = ctypes.windll.user32
          user32.GetForegroundWindow.restype = wintypes.HWND
          user32.GetActiveWindow.restype = wintypes.HWND
          user32.SetForegroundWindow.argtypes = [wintypes.HWND]
          user32.SetForegroundWindow.restype = wintypes.BOOL
          user32.GetWindowThreadProcessId.argtypes = [wintypes.HWND, ctypes.c_void_p]
          user32.GetWindowThreadProcessId.restype = wintypes.DWORD

          class RECT(ctypes.Structure):
              _fields_ = [("l", wintypes.LONG), ("t", wintypes.LONG), ("r", wintypes.LONG), ("b", wintypes.LONG)]
          class GTI(ctypes.Structure):
              _fields_ = [("cbSize", wintypes.DWORD), ("flags", wintypes.DWORD),
                          ("hwndActive", wintypes.HWND), ("hwndFocus", wintypes.HWND),
                          ("hwndCapture", wintypes.HWND), ("hwndMenuOwner", wintypes.HWND),
                          ("hwndMoveSize", wintypes.HWND), ("hwndCaret", wintypes.HWND), ("rc", RECT)]
          user32.GetGUIThreadInfo.argtypes = [wintypes.DWORD, ctypes.POINTER(GTI)]
          user32.GetGUIThreadInfo.restype = wintypes.BOOL

          r = {}
          form = WinForms.Form()
          form.Text = "win32probe"
          def on_shown(sender, args):
              form.Activate()
              hwnd = form.Handle.ToInt64()
              r["hwnd"] = hwnd
              r["fg"] = user32.GetForegroundWindow()
              r["act"] = user32.GetActiveWindow()
              r["sfw_ret"] = user32.SetForegroundWindow(wintypes.HWND(hwnd))
              r["fg2"] = user32.GetForegroundWindow()
              r["act2"] = user32.GetActiveWindow()
              tid = user32.GetWindowThreadProcessId(wintypes.HWND(hwnd), None)
              g = GTI(); g.cbSize = ctypes.sizeof(GTI)
              r["gti_ok"] = user32.GetGUIThreadInfo(tid, ctypes.byref(g))
              r["gti_active"] = g.hwndActive
              r["gti_focus"] = g.hwndFocus
              r["activeform_null"] = (WinForms.Form.ActiveForm is None)
              form.Close()
          form.Shown += on_shown
          WinForms.Application.Run(form)

          def hx(v):
              return "0/None" if not v else hex(int(v))
          print(f"[win32] form HWND                 : {hx(r.get('hwnd'))}")
          print(f"[win32] GetForegroundWindow       : {hx(r.get('fg'))}")
          print(f"[win32] GetActiveWindow (thread)  : {hx(r.get('act'))}")
          print(f"[win32] SetForegroundWindow ret   : {r.get('sfw_ret')}")
          print(f"[win32] GetForegroundWindow after : {hx(r.get('fg2'))}")
          print(f"[win32] GetActiveWindow  after    : {hx(r.get('act2'))}")
          print(f"[win32] GetGUIThreadInfo ok       : {r.get('gti_ok')}")
          print(f"[win32] GUIThreadInfo.hwndActive  : {hx(r.get('gti_active'))}")
          print(f"[win32] GUIThreadInfo.hwndFocus   : {hx(r.get('gti_focus'))}")
          print(f"[win32] WinForms ActiveForm null  : {r.get('activeform_null')}")
          hwnd = r.get("hwnd")
          fg_is_ours = bool(r.get("fg")) and int(r.get("fg")) == hwnd
          act_is_ours = (bool(r.get("act")) and int(r.get("act")) == hwnd) or \
                        (bool(r.get("gti_active")) and int(r.get("gti_active")) == hwnd)
          print(f"[verdict] OS foreground IS our window     : {fg_is_ours}")
          print(f"[verdict] OS thread-active IS our window  : {act_is_ours}")
          if not act_is_ours:
              print("[verdict] => Win32 itself reports no active window => WoA window-manager layer")
          elif r.get("activeform_null"):
              print("[verdict] => Win32 active OK but WinForms.ActiveForm null => dotnet/winforms")
          else:
              print("[verdict] => both agree there is an active window")
          '@
          $w32 = $w32.Replace("__TMP__", $env:RUNNER_TEMP)
          Set-Content -Path "$env:RUNNER_TEMP\win32probe.py" -Value $w32 -Encoding utf8
          python "$env:RUNNER_TEMP\win32probe.py"
          Write-Host "win32 probe exit code: $LASTEXITCODE"
          exit 0

      - name: Can WE fix it? - try every foreground-forcing lever
        shell: powershell
        run: |
          $mit = @'
          from pathlib import Path
          import ctypes
          from ctypes import wintypes
          import clr_loader
          from pythonnet import set_runtime
          runtime_json = Path(r"__TMP__") / "runtime4.json"
          runtime_json.write_text("""
          { "runtimeOptions": { "tfm": "net10.0-windows", "frameworks": [
            { "name": "Microsoft.NETCore.App", "version": "10.0.0" },
            { "name": "Microsoft.WindowsDesktop.App", "version": "10.0.0" } ] } }
          """)
          set_runtime(clr_loader.get_coreclr(runtime_config=runtime_json))
          import clr
          clr.AddReference("System.Windows.Forms")
          import System.Windows.Forms as WinForms

          user32 = ctypes.windll.user32
          kernel32 = ctypes.windll.kernel32
          user32.GetForegroundWindow.restype = wintypes.HWND
          user32.SetForegroundWindow.argtypes = [wintypes.HWND]; user32.SetForegroundWindow.restype = wintypes.BOOL
          user32.BringWindowToTop.argtypes = [wintypes.HWND]; user32.BringWindowToTop.restype = wintypes.BOOL
          user32.GetWindowThreadProcessId.argtypes = [wintypes.HWND, ctypes.c_void_p]; user32.GetWindowThreadProcessId.restype = wintypes.DWORD
          user32.AttachThreadInput.argtypes = [wintypes.DWORD, wintypes.DWORD, wintypes.BOOL]; user32.AttachThreadInput.restype = wintypes.BOOL
          user32.SystemParametersInfoW.argtypes = [wintypes.UINT, wintypes.UINT, ctypes.c_void_p, wintypes.UINT]; user32.SystemParametersInfoW.restype = wintypes.BOOL
          kernel32.GetCurrentThreadId.restype = wintypes.DWORD
          SPI_GET, SPI_SET, SENDCHANGE = 0x2000, 0x2001, 0x2

          def get_lock():
              v = wintypes.DWORD(0)
              user32.SystemParametersInfoW(SPI_GET, 0, ctypes.cast(ctypes.byref(v), ctypes.c_void_p), 0)
              return v.value

          lock_before = get_lock()
          # LEVER 1: drop the foreground lock timeout to 0 (this is the one thing an IMAGE could bake in)
          set_ok = user32.SystemParametersInfoW(SPI_SET, 0, ctypes.c_void_p(0), SENDCHANGE)
          lock_after = get_lock()

          r = {}
          form = WinForms.Form()
          form.Text = "mitigation"
          def on_shown(sender, args):
              hwnd = form.Handle.ToInt64()
              fg = user32.GetForegroundWindow()
              fg_tid = user32.GetWindowThreadProcessId(fg, None) if fg else 0
              cur = kernel32.GetCurrentThreadId()
              # LEVER 2: AttachThreadInput to the foreground thread (classic SetForegroundWindow unlock)
              attached = user32.AttachThreadInput(cur, fg_tid, True) if (fg_tid and fg_tid != cur) else 0
              # LEVER 3: TopMost + BringWindowToTop + Activate + SetForegroundWindow
              form.TopMost = True
              user32.BringWindowToTop(wintypes.HWND(hwnd))
              form.Activate()
              r["sfw"] = user32.SetForegroundWindow(wintypes.HWND(hwnd))
              if attached:
                  user32.AttachThreadInput(cur, fg_tid, False)
              r["hwnd"] = hwnd
              r["fg_after"] = user32.GetForegroundWindow()
              r["attached"] = bool(attached)
              r["activeform_null"] = (WinForms.Form.ActiveForm is None)
              form.Close()
          form.Shown += on_shown
          WinForms.Application.Run(form)

          def hx(v): return "0/None" if not v else hex(int(v))
          print(f"[mitig] ForegroundLockTimeout before : {lock_before}")
          print(f"[mitig] SPI_SET lock->0 succeeded    : {bool(set_ok)}")
          print(f"[mitig] ForegroundLockTimeout after  : {lock_after}")
          print(f"[mitig] AttachThreadInput used       : {r.get('attached')}")
          print(f"[mitig] SetForegroundWindow ret      : {r.get('sfw')}")
          print(f"[mitig] foreground now OUR window     : {bool(r.get('fg_after')) and int(r.get('fg_after')) == r.get('hwnd')}   (fg={hx(r.get('fg_after'))}, ours={hx(r.get('hwnd'))})")
          print(f"[mitig] WinForms ActiveForm null      : {r.get('activeform_null')}")
          fixed = (bool(r.get('fg_after')) and int(r.get('fg_after')) == r.get('hwnd')) and not r.get('activeform_null')
          print(f"[VERDICT] a runtime/image-side lever FIXED it: {fixed}")
          print("[VERDICT] => there is nothing on our side" if not fixed else "[VERDICT] => a workaround EXISTS - revisit the 'nothing we can do' claim")
          '@
          $mit = $mit.Replace("__TMP__", $env:RUNNER_TEMP)
          Set-Content -Path "$env:RUNNER_TEMP\mitig.py" -Value $mit -Encoding utf8
          python "$env:RUNNER_TEMP\mitig.py"
          Write-Host "mitigation probe exit code: $LASTEXITCODE"
          exit 0
