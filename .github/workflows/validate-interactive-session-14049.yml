# TEMPORARY - validation aid for #14049.
# Measures whether the runner agent runs in an interactive desktop session,
# comparing windows-latest (x64) against windows-11-arm. Records the canonical
# signals (Environment.UserInteractive, the process session id vs the active
# console session id, and the window-station name) and also reproduces the
# reporter's Form.ActiveForm check so we can see whether that check itself
# behaves differently across the two images.
# Delete this file before opening any PR.

name: Validate Interactive Session 14049

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/interactive-session-14049*'

jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Canonical interactivity signals
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class Native {
              [DllImport("kernel32.dll")] public static extern uint WTSGetActiveConsoleSessionId();
              [DllImport("kernel32.dll")] public static extern uint GetCurrentProcessId();
              [DllImport("kernel32.dll")] public static extern bool ProcessIdToSessionId(uint dwProcessId, out uint pSessionId);
              [DllImport("user32.dll")] public static extern IntPtr GetProcessWindowStation();
              [DllImport("user32.dll")] public static extern IntPtr GetThreadDesktop(uint dwThreadId);
              [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              public static extern bool GetUserObjectInformation(IntPtr hObj, int nIndex, StringBuilder pvInfo, int nLength, out int lpnLengthNeeded);
              public static string ObjName(IntPtr hObj) {
                  int needed;
                  var sb = new StringBuilder(256);
                  GetUserObjectInformation(hObj, 2 /*UOI_NAME*/, sb, sb.Capacity, out needed);
                  return sb.ToString();
              }
          }
          "@

          $procSession = 0
          [void][Native]::ProcessIdToSessionId([Native]::GetCurrentProcessId(), [ref]$procSession)
          $consoleSession = [Native]::WTSGetActiveConsoleSessionId()
          $winsta = [Native]::ObjName([Native]::GetProcessWindowStation())
          $desktop = [Native]::ObjName([Native]::GetThreadDesktop([Native]::GetCurrentThreadId()))

          Write-Host "OS matrix leg          : ${{ matrix.os }}"
          Write-Host "OS architecture        : $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Environment.UserInteractive : $([System.Environment]::UserInteractive)"
          Write-Host "Process session id     : $procSession"
          Write-Host "Active console session : $consoleSession  (0xFFFFFFFF = no console/attached session)"
          Write-Host "Session match          : $($procSession -eq $consoleSession)"
          Write-Host "Window station         : $winsta   (WinSta0 = interactive; Service-0x... = non-interactive)"
          Write-Host "Thread desktop         : $desktop"

      - name: Reproduce the reporter's Form.ActiveForm check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $form = New-Object System.Windows.Forms.Form
          $form.Text = "probe"
          $form.Size = New-Object System.Drawing.Size(300,200)

          $activeAfterShow = $null
          $form.Add_Shown({
              $form.Activate()
              $script:activeAfterShow = [System.Windows.Forms.Form]::ActiveForm
              $form.Close()
          })

          try {
              [System.Windows.Forms.Application]::Run($form)
              $active = $script:activeAfterShow
              Write-Host "Form.ActiveForm after Show/Activate: $(if ($active) { 'NON-null (' + $active.Text + ')' } else { 'null' })"
              Write-Host "Reporter's verdict would be: $(if ($active) { 'Interactive desktop session detected' } else { 'Non-interactive session detected' })"
          } catch {
              Write-Host "WinForms Application.Run threw: $($_.Exception.GetType().FullName): $($_.Exception.Message)"
          }
