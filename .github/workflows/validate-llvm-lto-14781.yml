# TEMPORARY - regression matrix for #14781 (LLVMgold bfd-plugins cleanup).
# For every Ubuntu image, runs the same LTO/archive/linker scenarios three times:
#   baseline      - image as shipped
#   keep-default  - only the default clang's LLVMgold registered in /usr/lib/bfd-plugins
#   keep-newest   - only the newest clang's LLVMgold registered
# A regression = PASS on baseline but FAIL (or new plugin warning) on a variant.
name: Validate LLVM LTO 14781

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/llvm-lto-14781*'

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-22.04-arm, ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      RESULTS: ${{ github.workspace }}/results-${{ matrix.runner }}.csv
    steps:
      - uses: actions/checkout@v5

      - name: Inventory
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion arch=$(uname -m)"
          ls -l /usr/lib/bfd-plugins/
          readlink -f /usr/bin/clang /usr/bin/ld
          ls /usr/bin/g++-[0-9]* /usr/lib/llvm-*/bin/clang
          # save the shipped symlinks so each variant starts from the real image state
          for f in /usr/lib/bfd-plugins/LLVMgold-*.so; do echo "$f $(readlink "$f")"; done > "$RUNNER_TEMP/plugins.txt"
          toolset=images/ubuntu/toolsets/toolset-$(. /etc/os-release; echo ${VERSION_ID/./})$([[ $(uname -m) == aarch64 ]] && echo -arm64).json
          echo "TOOLSET=$toolset" >> "$GITHUB_ENV"
          jq -c .clang "$toolset"

      - name: baseline
        run: bash .github/workflows/lto-matrix.sh baseline

      - name: keep-default (proposed install-clang.sh change)
        run: |
          default=$(jq -r .clang.default_version "$TOOLSET")
          # --- proposed install-clang.sh snippet ---
          for version in $(jq -r '.clang.versions[]' "$TOOLSET"); do
            if [[ $version != $default ]]; then
              sudo rm -f "/usr/lib/bfd-plugins/LLVMgold-${version}.so"
            fi
          done
          # ------------------------------------------
          ls -l /usr/lib/bfd-plugins/
          bash .github/workflows/lto-matrix.sh keep-default

      - name: keep-newest
        run: |
          while read -r f t; do sudo ln -sfn "$t" "$f"; done < "$RUNNER_TEMP/plugins.txt"
          newest=$(jq -r '.clang.versions[]' "$TOOLSET" | sort -n | tail -1)
          for version in $(jq -r '.clang.versions[]' "$TOOLSET"); do
            if [[ $version != $newest ]]; then sudo rm -f "/usr/lib/bfd-plugins/LLVMgold-${version}.so"; fi
          done
          ls -l /usr/lib/bfd-plugins/
          bash .github/workflows/lto-matrix.sh keep-newest

      - name: side effects - dpkg and apt with symlinks removed (informational)
        continue-on-error: true
        run: |
          set +e
          default=$(jq -r .clang.default_version "$TOOLSET")
          other=$(jq -r '.clang.versions[]' "$TOOLSET" | grep -vx "$default" | head -1)
          sudo rm -f /usr/lib/bfd-plugins/LLVMgold-$other.so
          echo "--- dpkg --verify llvm-$other-linker-tools"
          dpkg --verify "llvm-$other-linker-tools"; echo "exit=$?"
          echo "--- apt-get check"
          sudo apt-get check; echo "exit=$?"
          echo "--- apt reinstall restores the symlink?"
          sudo apt-get update -qq && sudo apt-get install --reinstall -y -qq "llvm-$other-linker-tools" >/dev/null 2>&1; echo "exit=$?"
          ls -l /usr/lib/bfd-plugins/

      - name: Summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, os, collections
          rows = list(csv.reader(open(os.environ["RESULTS"])))
          res = collections.OrderedDict()
          for var, img, case, r, w in rows:
              res.setdefault(case, {})[var] = r + ("*" if w == "1" else "")
          vs = ["baseline", "keep-default", "keep-newest"]
          print(f"### {rows[0][1]}\n\n| case | " + " | ".join(vs) + " |\n|---|" + "---|" * len(vs))
          for case, d in res.items():
              print(f"| {case} | " + " | ".join(d.get(v, "-") for v in vs) + " |")
          print("\n`*` = binutils printed an LLVM plugin error")
          EOF
          cat "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.runner }}
          path: ${{ env.RESULTS }}
