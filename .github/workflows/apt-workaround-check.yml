name: apt workaround check
on:
  push:
    branches: [probe/15142-apt-speed]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Download-only workaround on a simulated trickling mirror
        run: |
          pkgs="pkg-config libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev at-spi2-core python3-pyatspi sway grim"
          sudo apt-get update
          start=$(date +%s)
          # Dl-Limit simulates the slow westus3 mirror on the first attempt only.
          if ! timeout 120 sudo apt-get install --yes --download-only -o Acquire::http::Dl-Limit=80 $pkgs > /tmp/first.log 2>&1; then
            echo "download attempt killed after $(( $(date +%s) - start ))s; $(grep -c '^Get:' /tmp/first.log) Get lines"
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            sudo apt-get install --yes --download-only $pkgs > /tmp/second.log 2>&1
            grep -E '^Fetched' /tmp/second.log
            echo 'hosts used by retry:'; grep '^Get:' /tmp/second.log | grep -oE 'https?://[^ ]+' | sort | uniq -c
          fi
          start=$(date +%s)
          sudo apt-get install --yes $pkgs > /tmp/install.log 2>&1
          echo "install from cache took $(( $(date +%s) - start ))s; $(grep -c '^Get:' /tmp/install.log) Get lines"
          dpkg -s libwebkitgtk-6.0-dev sway grim | grep -E '^(Package|Status)'
