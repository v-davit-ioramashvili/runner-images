# TEMPORARY - validation aid for #14783. Not part of the PR.
# 1) applies the drop-in exactly as configure-environment.sh does and checks grub.cfg
# 2) boots the runner's own kernel in QEMU with that lsm= value and reads the LSM init line
name: Validate BPF LSM boot 14783

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/bpf-lsm-14783-boot*'

jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Apply drop-in and regenerate grub.cfg
        run: |
          lsm_dropin='/etc/default/grub.d/99-runner-lsm.cfg'
          echo 'GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT lsm=landlock,lockdown,yama,integrity,apparmor,bpf"' | sudo tee "$lsm_dropin"
          sudo update-grub 2>&1 | tail -5
          echo "--- default entry"
          sudo grep -m1 -E '^\s*linux\s' /boot/grub/grub.cfg
          entry=$(sudo grep -m1 -E '^\s*linux\s' /boot/grub/grub.cfg)
          grep -q 'rootflags=nobarrier,data=writeback,journal_async_commit,commit=30' <<< "$entry"
          grep -q 'lsm=landlock,lockdown,yama,integrity,apparmor,bpf' <<< "$entry"
          echo "OK: default entry carries both rootflags and lsm="

      - name: Boot runner kernel in QEMU with the new lsm=
        run: |
          sudo apt-get -qq update >/dev/null
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get -qq install -y qemu-system-x86 busybox-static cpio >/dev/null
            qemu=(qemu-system-x86_64 -M q35 -m 2048) ; con="console=ttyS0"
          else
            sudo apt-get -qq install -y qemu-system-arm busybox-static cpio >/dev/null
            qemu=(qemu-system-aarch64 -M virt -m 2048) ; con="console=ttyAMA0 earlycon"
          fi
          if [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm 2>/dev/null; then
            qemu+=(-enable-kvm -cpu host); echo "KVM: yes"
          else
            qemu+=(-cpu max); echo "KVM: no (TCG)"
          fi
          sudo cat "/boot/vmlinuz-$(uname -r)" > /tmp/vmlinuz.orig
          if file /tmp/vmlinuz.orig | grep -q gzip; then zcat /tmp/vmlinuz.orig > /tmp/vmlinuz; else cp /tmp/vmlinuz.orig /tmp/vmlinuz; fi
          file /tmp/vmlinuz
          # Minimal initramfs: mount securityfs, print the active LSM list, power off
          mkdir -p /tmp/ir/bin && cp /bin/busybox /tmp/ir/bin/busybox
          printf '%s\n' '#!/bin/busybox sh' \
            '/bin/busybox mkdir -p /sys /proc' \
            '/bin/busybox mount -t sysfs sysfs /sys' \
            '/bin/busybox mount -t securityfs securityfs /sys/kernel/security' \
            'echo "ACTIVE_LSM=$(/bin/busybox cat /sys/kernel/security/lsm)"' \
            '/bin/busybox poweroff -f' > /tmp/ir/init
          chmod +x /tmp/ir/init
          (cd /tmp/ir && find . | cpio -o -H newc --quiet | gzip > /tmp/initrd.gz)
          timeout 900 "${qemu[@]}" -smp 2 -nographic -no-reboot \
            -kernel /tmp/vmlinuz -initrd /tmp/initrd.gz \
            -append "$con panic=-1 rdinit=/init lsm=landlock,lockdown,yama,integrity,apparmor,bpf" \
            > /tmp/boot.log 2>&1 || true
          grep -a -E 'LSM|eBPF' /tmp/boot.log | head -10
          line=$(grep -a '^ACTIVE_LSM=' /tmp/boot.log | tr -d '\r')
          echo "$line"
          [[ ",${line#ACTIVE_LSM=}," == *",bpf,"* ]]
          [[ ",${line#ACTIVE_LSM=}," == *",apparmor,"* ]]
          echo "OK: guest kernel has apparmor and bpf active"

      - name: Boot log tail on failure
        if: failure()
        run: tail -60 /tmp/boot.log || true
