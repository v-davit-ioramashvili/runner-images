name: Validate sysctl.conf not applied 15108

on:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Root-only values
        shell: bash
        run: |
          echo "ImageVersion=$ImageVersion"
          for k in vm.mmap_rnd_bits vm.max_map_count; do
            printf '%-20s live=%s conf=%s\n' "$k" "$(sudo sysctl -n $k)" "$(grep -E "^$k=" /etc/sysctl.conf | tail -1 | cut -d= -f2)"
          done
          grep -h CONFIG_ARCH_MMAP_RND_BITS /boot/config-$(uname -r) 2>/dev/null || true
