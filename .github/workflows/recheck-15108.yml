name: recheck-15108
on: workflow_dispatch
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Inspect sysctl config
        run: |
          echo "ImageVersion=$ImageVersion ImageOS=$ImageOS"
          systemctl --version | head -1
          echo "--- /etc/sysctl.conf runner lines"; grep -nE 'inotify|mmap_rnd|max_map' /etc/sysctl.conf || echo none
          echo "--- 99-sysctl.conf symlink"; ls -l /etc/sysctl.d/99-sysctl.conf 2>&1 || true
          echo "--- runner-images drop-in"; ls -l /etc/sysctl.d/99-runner-images.conf 2>&1 || true
          echo "--- live values"
          for k in fs.inotify.max_user_instances fs.inotify.max_user_watches vm.mmap_rnd_bits vm.max_map_count; do
            echo "$k=$(sudo sysctl -n $k)"
          done
