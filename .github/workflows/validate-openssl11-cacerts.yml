# TEMPORARY - validation aid for the macOS 14/15 arm64 build failure
#   "Error: No formulae or casks found for ca-certificates."
# in install-openssl.sh. Not for merge.
#
# Earlier iterations (same branch):
#   44090072051, 44092865013 - reproduced on Homebrew 7.0.14 (macOS 15 arm64);
#                              an up-to-date ca-certificates still fails.
#   44099173723 (Linux)      - repro passes on 7.0.12, fails on 7.0.14;
#                              pinning ca-certificates.rb and a local tap both fix it;
#                              the Custom-Formula path from #15325 fails.
#   44115417141              - pinned ca-certificates passes on macOS 26 arm64.
#   44124611324              - real fixed script passes on macOS 26 arm64.
#
# This iteration adds: later build steps after the fix (install-ruby/rust style
# installs, outdated/upgrade checks), and a "stale" pin where the pinned
# ca-certificates.rb (2026-10-20) is older than the installed one (2026-11-05),
# which is what happens once ca-certificates gets a new release after this pin.
#
# This iteration runs the real install-openssl.sh from the fix branch
# macos-openssl11-pin-cacerts. Each job first undoes what the image already did
# for openssl@1.1 and updates Homebrew the way the arm64 build does. On macos-26
# the Tahoe/GoldenGate checks are stubbed to false so the macOS 14/15 path runs.

name: Validate openssl@1.1 ca-certificates

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/macos-openssl11-cacerts'

jobs:
  # macOS jobs in 44133041888 were all cancelled for lack of arm64 capacity, so
  # the later-steps and stale-pin questions also run on Linux Homebrew 7.0.14
  # with the same two pinned formula files the fix downloads.
  linux-brew:
    strategy:
      fail-fast: false
      matrix:
        pin:
          - { name: current, commit: 5367b4e0885b7f463a8bb756b35a9ee446df2585 }
          - { name: stale, commit: ddecfafe263bc2b7c34528327a4f30b0bfbcc13b }
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: linux / ${{ matrix.pin.name }} pin
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare Homebrew like the arm64 build
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          B=/home/linuxbrew/.linuxbrew/bin/brew
          $B update
          $B install ca-certificates openssl@4
          $B --version | head -1
          $B list --versions ca-certificates

      - name: Install openssl@1.1 the way the fixed script does
        run: |
          set -x
          CORE="$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          mkdir -p "$CORE/Formula/o" "$CORE/Formula/c"
          curl -fsSL "https://raw.githubusercontent.com/Homebrew/homebrew-core/d91dabd087cb0b906c92a825df9e5e5e1a4f59f8/Formula/o/openssl@1.1.rb" -o "$CORE/Formula/o/openssl@1.1.rb"
          curl -fsSL "https://raw.githubusercontent.com/Homebrew/homebrew-core/${{ matrix.pin.commit }}/Formula/c/ca-certificates.rb" -o "$CORE/Formula/c/ca-certificates.rb"
          grep -m1 'url "' "$CORE/Formula/c/ca-certificates.rb"
          brew unlink openssl@4
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 brew install openssl@1.1
          brew unlink openssl@1.1
          brew link openssl@4
          brew list --versions ca-certificates openssl@1.1
          "$(brew --prefix openssl@1.1)/bin/openssl" version

      - name: Later build steps still work
        run: |
          set -x
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew info ca-certificates > "$RUNNER_TEMP/ca-info.txt"; head -3 "$RUNNER_TEMP/ca-info.txt"
          brew install ruby@3.3
          "$(brew --prefix ruby@3.3)/bin/ruby" -ropenssl -e 'puts OpenSSL::OPENSSL_LIBRARY_VERSION'
          brew install rustup hello
          hello
          brew list --versions ca-certificates openssl@1.1 openssl@3 openssl@4
          brew outdated || true
          brew upgrade --dry-run ca-certificates || true

  install-openssl:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-26, macos-15]
        pin: [current, stale]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-openssl11-pin-cacerts

      - name: Reset openssl@1.1 to pre-install state
        run: |
          brew list --versions openssl@1.1 ca-certificates openssl@3 openssl@4 || true
          brew uninstall --ignore-dependencies --force openssl@1.1 || true
          rm -f "$(brew --prefix)/bin/openssl"
          rm -rf "$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          brew update
          brew --version | head -1
          if ! brew list --versions openssl@4 > /dev/null 2>&1; then
            brew install openssl@4
          fi
          brew link --overwrite openssl@4

      - name: Stage utils.sh like the image build
        run: |
          mkdir -p ~/utils
          cp images/macos/scripts/helpers/utils.sh ~/utils/utils.sh
          {
            echo 'invoke_tests() { echo "invoke_tests $* (stubbed, checked in the next step)"; }'
            if [ "${{ matrix.image }}" = "macos-26" ]; then
              echo 'is_Tahoe() { false; }'
              echo 'is_GoldenGate() { false; }'
            fi
          } >> ~/utils/utils.sh

      - name: Use an older ca-certificates pin (stale case)
        if: matrix.pin == 'stale'
        run: |
          sed -i '' 's/^  CA_COMMIT=.*/  CA_COMMIT=ddecfafe263bc2b7c34528327a4f30b0bfbcc13b/' images/macos/scripts/build/install-openssl.sh
          grep -n "CA_COMMIT=" images/macos/scripts/build/install-openssl.sh
          brew list --versions ca-certificates

      - name: Run install-openssl.sh from the fix branch
        run: bash -e -o pipefail images/macos/scripts/build/install-openssl.sh

      - name: Check like OpenSSL.Tests.ps1 (macOS 14/15 contexts)
        run: |
          set -x
          openssl version
          test -d "$(brew --prefix openssl@1.1)"
          openssl version | grep -q "OpenSSL 1.1"
          "$(brew --prefix openssl@4)/bin/openssl" version

      - name: Later build steps still work
        run: |
          set -x
          source ~/utils/utils.sh
          brew info ca-certificates > "$RUNNER_TEMP/ca-info.txt"; head -3 "$RUNNER_TEMP/ca-info.txt"
          brew_smart_install "ruby@3.3"
          "$(brew --prefix ruby@3.3)/bin/ruby" -ropenssl -e 'puts OpenSSL::OPENSSL_LIBRARY_VERSION'
          brew_smart_install rustup
          brew_smart_install hello
          hello
          brew list --versions ca-certificates openssl@1.1 openssl@3 openssl@4
          brew outdated || true
          brew upgrade --dry-run ca-certificates || true
          openssl version | grep -q "OpenSSL 1.1"
