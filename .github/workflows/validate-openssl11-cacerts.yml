# TEMPORARY - validation aid for the macOS 14/15 arm64 build failure
#   "Error: No formulae or casks found for ca-certificates."
# in install-openssl.sh. Not for merge.
#
# Earlier iterations (same branch):
#   44090072051, 44092865013 - reproduced on Homebrew 7.0.14 (macOS 15 arm64);
#                              an up-to-date ca-certificates still fails.
#   44099173723 (Linux)      - repro passes on 7.0.12, fails on 7.0.14;
#                              pinning ca-certificates.rb and a local tap both fix it;
#                              the Custom-Formula path from #15325 fails.
#   44115417141              - pinned ca-certificates passes on macOS 26 arm64.
#
# This iteration runs the real install-openssl.sh from the fix branch
# macos-openssl11-pin-cacerts. Each job first undoes what the image already did
# for openssl@1.1 and updates Homebrew the way the arm64 build does. On macos-26
# the Tahoe/GoldenGate checks are stubbed to false so the macOS 14/15 path runs.

name: Validate openssl@1.1 ca-certificates

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/macos-openssl11-cacerts'

jobs:
  install-openssl:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-14, macos-26]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: macos-openssl11-pin-cacerts

      - name: Reset openssl@1.1 to pre-install state
        run: |
          brew list --versions openssl@1.1 ca-certificates openssl@3 openssl@4 || true
          brew uninstall --ignore-dependencies --force openssl@1.1 || true
          rm -f "$(brew --prefix)/bin/openssl"
          rm -rf "$(brew --repository)/Library/Taps/homebrew/homebrew-core"
          brew update
          brew --version | head -1
          if ! brew list --versions openssl@4 > /dev/null 2>&1; then
            brew install openssl@4
          fi
          brew link --overwrite openssl@4

      - name: Stage utils.sh like the image build
        run: |
          mkdir -p ~/utils
          cp images/macos/scripts/helpers/utils.sh ~/utils/utils.sh
          {
            echo 'invoke_tests() { echo "invoke_tests $* (stubbed, checked in the next step)"; }'
            if [ "${{ matrix.image }}" = "macos-26" ]; then
              echo 'is_Tahoe() { false; }'
              echo 'is_GoldenGate() { false; }'
            fi
          } >> ~/utils/utils.sh

      - name: Run install-openssl.sh from the fix branch
        run: bash -e -o pipefail images/macos/scripts/build/install-openssl.sh

      - name: Check like OpenSSL.Tests.ps1 (macOS 14/15 contexts)
        run: |
          set -x
          openssl version
          test -d "$(brew --prefix openssl@1.1)"
          openssl version | grep -q "OpenSSL 1.1"
          "$(brew --prefix openssl@4)/bin/openssl" version

      - name: Later Homebrew installs still work
        run: |
          brew install hello
          hello
