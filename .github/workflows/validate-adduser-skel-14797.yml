# TEMPORARY - validate #14797 workaround with a real Dokku install (same steps as reporter).
name: Validate adduser skel 14797

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/adduser-skel-14797*'

jobs:
  dokku:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
        workaround: [false, true]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Workaround
        if: matrix.workaround
        run: sudo rm -rf /etc/skel/.nvm/test

      - name: Install Dokku (reporter's steps)
        run: |
          set -x
          echo "ImageVersion=$ImageVersion"
          sudo install -m 0755 -d /etc/apt/keyrings
          wget -nv -O - https://packagecloud.io/dokku/dokku/gpgkey | sudo gpg --dearmor -o /etc/apt/keyrings/dokku-key.gpg
          echo "deb [signed-by=/etc/apt/keyrings/dokku-key.gpg] https://packagecloud.io/dokku/dokku/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/dokku.list
          sudo apt-get update -q
          echo dokku dokku/skip_key_file boolean true | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y dokku

      - name: Verify
        run: |
          dokku version
          getent passwd dokku
          sudo ls -a /home/dokku | head -20
          sudo -u dokku bash -lc 'echo HOME=$HOME; source ~/.nvm/nvm.sh && nvm --version'
