# TEMPORARY - recheck #14797 on the current 26.04 images.
name: Validate adduser skel 14797

on:
  push:
    branches:
      - 'validate/adduser-skel-14797*'

jobs:
  recheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          echo "ImageVersion=$ImageVersion"
          dpkg-query -W adduser
          echo "non-ascii in skel: $(sudo find /etc/skel -name '*[! -~]*' | wc -l)"
          sudo adduser --disabled-password --gecos "" asis && echo "ADDUSER OK" || echo "ADDUSER FAILED"
