# TEMPORARY: runs the proposed clang canary action (with the new C++ step) on every hosted image (#15367).
name: Validate clang canary C++ step

on:
  push:
    branches:
      - 'validate/canary-clang-cpp*'

jobs:
  clang:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-2025-vs2026, windows-11-arm, windows-11-vs2026-arm, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm, macos-15, macos-26]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        shell: bash
        run: clang --version | head -1; clang++ --version | head -1; echo "ImageVersion=$ImageVersion"
      - name: Proposed clang canary action
        uses: ./.github/actions/clang
