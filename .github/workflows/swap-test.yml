name: xcode-settings-15313
on:
  push:
    branches: [swap-test-15313]
  workflow_dispatch:

jobs:
  settings:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Create package with 40 files
        run: |
          xcodebuild -version
          xcodebuild -help 2>&1 | grep -A1 -E '^\s*-jobs' || true
          mkdir -p Pkg/Sources/Lib && cd Pkg
          cat > Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "Lib", platforms: [.macOS(.v14)], products: [.library(name: "Lib", type: .dynamic, targets: ["Lib"])], targets: [.target(name: "Lib")])
          EOF
          for i in $(seq 1 40); do echo "public struct S$i { public let next: S$(( (i % 40) + 1 ))? = nil; public init() {} }" > Sources/Lib/File$i.swift; done

      - name: Build variants and inspect swiftc args and .d files
        run: |
          cd Pkg
          variant() {
            name=$1; shift
            dd="$RUNNER_TEMP/dd-$name"
            xcodebuild -scheme Lib -destination 'generic/platform=macOS' -derivedDataPath "$dd" -configuration Release "$@" build > "$RUNNER_TEMP/$name.log" 2>&1
            echo "=== $name (exit $?) settings: $*"
            grep -oE '(-num-threads [0-9]+|-j[0-9]+|-whole-module-optimization|-enable-batch-mode|-disable-batch-mode)' "$RUNNER_TEMP/$name.log" | sort | uniq -c
            for d in $(find "$dd" -path '*Objects-normal*' -name '*.d' -size +0 | grep -v emit-module); do
              echo "  $(basename $d): lines=$(wc -l < $d) bytes=$(wc -c < $d)"
            done | sort | head -5
            echo "  .d files: $(find "$dd" -path '*Objects-normal*' -name '*.d' | grep -v emit-module | wc -l)"
          }
          variant wmo_default SWIFT_COMPILATION_MODE=wholemodule
          variant wmo_parallel_off SWIFT_COMPILATION_MODE=wholemodule SWIFT_USE_PARALLEL_WHOLE_MODULE_OPTIMIZATION=NO
          variant wmo_batch_off SWIFT_COMPILATION_MODE=wholemodule SWIFT_ENABLE_BATCH_MODE=NO
          variant singlefile SWIFT_COMPILATION_MODE=singlefile
