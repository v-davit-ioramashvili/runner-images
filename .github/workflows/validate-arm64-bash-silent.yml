# TEMPORARY - diagnostic for #14052 (windows-11-arm composite bash steps
# intermittently produce zero output and exit 0).
# Tier 1 (facts): prove whether the bash the runner uses is native ARM64 or an
# x86 binary under WoW64 emulation - this confirms or kills the reporter's root
# cause. Tier 2 (repro): fire a large batch of independent `shell: bash` steps,
# both top-level and inside a composite action, each writing a marker line; a
# final check fails if any step silently did nothing while exiting 0.
# Delete this file (and .github/actions/bashprobe) when done.

name: Validate ARM64 bash silent skip (#14052)

on:
  workflow_dispatch:
  push:
    branches:
      - 'validate/arm64-bash*'

jobs:
  facts:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Architecture of the bash toolchain the runner uses
        shell: pwsh
        run: |
          function Get-PEMachine([string] $Path) {
            if (-not (Test-Path $Path)) { return "MISSING" }
            $stream = [IO.File]::OpenRead($Path)
            try {
              $reader = New-Object IO.BinaryReader($stream)
              $stream.Position = 0x3C
              $stream.Position = $reader.ReadInt32() + 4
              $machine = $reader.ReadUInt16()
            } finally { $stream.Dispose() }
            switch ($machine) {
              0x8664  { "x64" }
              0xAA64  { "ARM64" }
              0x014C  { "x86" }
              default { "0x{0:X4}" -f $machine }
            }
          }
          $targets = @(
            "C:\Program Files\Git\bin\bash.exe",
            "C:\Program Files\Git\usr\bin\bash.exe",
            "C:\Program Files\Git\usr\bin\msys-2.0.dll",
            "C:\Program Files\Git\cmd\git.exe",
            "C:\Program Files\Git\mingw64\bin\git.exe"
          )
          foreach ($t in $targets) { Write-Host ("{0,-8} {1}" -f (Get-PEMachine $t), $t) }
          Write-Host "----"
          Write-Host "Get-Command bash -> $((Get-Command bash -ErrorAction SilentlyContinue).Source)"
          Write-Host "where.exe bash:"
          where.exe bash
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Versions and uname from bash
        shell: bash
        run: |
          set -euo pipefail
          git --version
          bash --version | head -1
          uname -a
          echo "uname -m = $(uname -m)"

  repro-toplevel:
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    steps:
      - name: Reset marker
        shell: pwsh
        run: Set-Content -Path "$env:GITHUB_WORKSPACE/marker.log" -Value $null
      - name: b001
        shell: bash
        run: |
          set -euo pipefail
          echo "iter 1 pid=$$ ppid=$PPID uname=$(uname -m)"
          echo "1" >> "$GITHUB_WORKSPACE/marker.log"
      - name: b002
        shell: bash
        run: |
          set -euo pipefail
          echo "iter 2 pid=$$ ppid=$PPID uname=$(uname -m)"
          echo "2" >> "$GITHUB_WORKSPACE/marker.log"
      - name: b003
