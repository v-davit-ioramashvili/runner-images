      - name: Check for silent skips
        if: always()
        shell: pwsh
        run: |
          $expected = 200
          $lines = @(Get-Content "$env:GITHUB_WORKSPACE/marker.log" -ErrorAction SilentlyContinue | Where-Object { $_ -ne "" })
          $got = $lines.Count
          Write-Host "expected=$expected got=$got"
          $present = @($lines | ForEach-Object { [int]$_ })
          $missing = @(1..$expected | Where-Object { $_ -notin $present })
          if ($missing.Count -gt 0) {
            Write-Host "MISSING iterations: $($missing -join ',')"
            throw "Reproduced silent skip: $($missing.Count) bash step(s) produced no output / no side effect but exited 0"
          }
          Write-Host "No silent skips detected in this shard."

  repro-composite:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Reset marker
        shell: pwsh
        run: Set-Content -Path "$env:GITHUB_WORKSPACE/marker.log" -Value $null
      - name: Run composite bash probe
        uses: ./.github/actions/bashprobe
      - name: Check for silent skips
        if: always()
        shell: pwsh
        run: |
          $expected = 100
          $lines = @(Get-Content "$env:GITHUB_WORKSPACE/marker.log" -ErrorAction SilentlyContinue | Where-Object { $_ -ne "" })
          $got = $lines.Count
          Write-Host "expected=$expected got=$got"
          $present = @($lines | ForEach-Object { [int]$_ })
          $missing = @(1..$expected | Where-Object { $_ -notin $present })
          if ($missing.Count -gt 0) {
            Write-Host "MISSING iterations: $($missing -join ',')"
            throw "Reproduced silent skip: $($missing.Count) bash step(s) produced no output / no side effect but exited 0"
          }
          Write-Host "No silent skips detected in this shard."
