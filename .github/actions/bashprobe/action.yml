# TEMPORARY - part of the #14052 diagnostic. A composite action whose bash
# steps each append a marker line; the calling job asserts none were silently
# skipped. Delete with the validate-arm64-bash-silent.yml workflow.
name: bashprobe
description: Fire many composite bash steps that each write a marker line.
